notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field
  name; direction is from the entity that owns the reference.
description: >-
  OpenAI's object model has two clearly separated halves and a seam between
  them. The INFERENCE half (Response, Conversation, Item) is the current
  generation and is deliberately shallow — a Response chains to its predecessor
  by previous_response_id and that is nearly the whole graph. The ASSISTANTS
  half (Assistant, Thread, Message, Run, RunStep) is the previous generation,
  deeply nested, and every one of its five top-level operations is flagged
  `deprecated: true` in the contract. Between them sits a shared RESOURCE layer
  — File, VectorStore, Container, Batch, FineTuningJob — that both halves
  reference by id and that carries most of the real referential integrity. The
  ADMINISTRATION layer (Organization, Project, User, Group, Role, ApiKey) is a
  separate graph entirely, reachable only with AdminApiKeyAuth. The dominant
  reference field in the whole contract is `event_id` (119 schemas), which is a
  measure of how much of this API is streamed rather than fetched.
