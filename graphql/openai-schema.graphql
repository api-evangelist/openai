"""
OpenAI GraphQL Schema (Conceptual)
Derived from the OpenAI REST API — https://platform.openai.com/docs/api-reference
OpenAI has no native public GraphQL endpoint. This schema models the REST surface
for tooling, federation, and design-reference purposes.
"""

# ─── Scalars ───────────────────────────────────────────────────────────────────

scalar JSON
scalar Upload

# ─── Enums ─────────────────────────────────────────────────────────────────────

enum Role {
  system
  user
  assistant
  tool
  function
}

enum ImageSize {
  SIZE_256x256
  SIZE_512x512
  SIZE_1024x1024
  SIZE_1792x1024
  SIZE_1024x1792
}

enum ImageFormat {
  url
  b64_json
}

enum ImageQuality {
  standard
  hd
}

enum AudioFormat {
  mp3
  opus
  aac
  flac
  wav
  pcm
}

enum TranscriptionFormat {
  json
  text
  srt
  verbose_json
  vtt
}

enum FilePurpose {
  fine_tune
  assistants
  batch
  vision
  user_data
}

enum FileStatus {
  uploaded
  processed
  error
}

enum FineTuningJobStatus {
  validating_files
  queued
  running
  succeeded
  failed
  cancelled
}

enum BatchStatus {
  validating
  failed
  in_progress
  finalizing
  completed
  expired
  cancelling
  cancelled
}

enum BatchEndpoint {
  CHAT_COMPLETIONS
  EMBEDDINGS
  COMPLETIONS
  RESPONSES
  MODERATIONS
}

enum AssistantToolType {
  code_interpreter
  file_search
  function
}

enum ThreadStatus {
  active
  locked
  closed
}

enum RunStatus {
  queued
  in_progress
  requires_action
  cancelling
  cancelled
  failed
  completed
  incomplete
  expired
}

enum RunStepType {
  message_creation
  tool_calls
}

enum RunStepStatus {
  in_progress
  cancelled
  failed
  completed
  expired
}

enum MessageRole {
  user
  assistant
}

enum MessageStatus {
  in_progress
  incomplete
  completed
}

enum VectorStoreStatus {
  expired
  in_progress
  completed
}

enum VectorStoreFileStatus {
  in_progress
  completed
  cancelled
  failed
}

enum ChunkingStrategyType {
  auto
  static
}

enum UploadStatus {
  pending
  completed
  cancelled
  expired
}

enum ModerationModel {
  text_moderation_stable
  text_moderation_latest
  omni_moderation_latest
}

enum AuditLogEventType {
  api_key_created
  api_key_updated
  api_key_deleted
  invite_sent
  invite_accepted
  invite_deleted
  login_failed
  logout
  organization_updated
  project_created
  project_updated
  project_archived
  service_account_created
  service_account_updated
  service_account_deleted
  user_added
  user_updated
  user_deleted
  fine_tuning_job_created
  fine_tuning_job_cancelled
  fine_tuning_job_failed
  fine_tuning_job_succeeded
}

enum ProjectStatus {
  active
  archived
}

enum OrganizationRole {
  owner
  reader
}

enum ProjectUserRole {
  owner
  member
}

# ─── Core Chat Types ────────────────────────────────────────────────────────────

type Model {
  id: String!
  object: String!
  created: Int!
  owned_by: String!
}

type ModelList {
  object: String!
  data: [Model!]!
}

type TextContent {
  type: String!
  text: String!
}

type ImageUrl {
  url: String!
  detail: String
}

type ImageContent {
  type: String!
  image_url: ImageUrl!
}

union MessageContent = TextContent | ImageContent

type FunctionDefinition {
  name: String!
  description: String
  parameters: JSON
  strict: Boolean
}

type FunctionTool {
  type: String!
  function: FunctionDefinition!
}

type Tool {
  type: String!
  function: FunctionDefinition
}

type FunctionCall {
  name: String!
  arguments: String!
}

type ToolCall {
  id: String!
  type: String!
  function: FunctionCall!
}

type ChatCompletionMessage {
  role: Role!
  content: String
  tool_calls: [ToolCall]
  tool_call_id: String
  name: String
  refusal: String
}

type CompletionUsage {
  prompt_tokens: Int!
  completion_tokens: Int!
  total_tokens: Int!
  prompt_tokens_details: JSON
  completion_tokens_details: JSON
}

type ChatCompletionChoice {
  index: Int!
  message: ChatCompletionMessage!
  finish_reason: String!
  logprobs: JSON
}

type ChatCompletion {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [ChatCompletionChoice!]!
  usage: CompletionUsage
  system_fingerprint: String
  service_tier: String
}

# ─── Streaming / Chunk Types ────────────────────────────────────────────────────

type ChatCompletionChunkDelta {
  role: Role
  content: String
  tool_calls: [ToolCall]
  refusal: String
}

type ChatCompletionChunkChoice {
  index: Int!
  delta: ChatCompletionChunkDelta!
  finish_reason: String
  logprobs: JSON
}

type ChatCompletionChunk {
  id: String!
  object: String!
  created: Int!
  model: String!
  choices: [ChatCompletionChunkChoice!]!
  usage: CompletionUsage
  system_fingerprint: String
}

# ─── Completion Request (legacy + chat input) ───────────────────────────────────

input CompletionRequest {
  model: String!
  prompt: String
  max_tokens: Int
  temperature: Float
  top_p: Float
  n: Int
  stream: Boolean
  stop: [String]
  presence_penalty: Float
  frequency_penalty: Float
