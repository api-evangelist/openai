# ─── Query ───────────────────────────────────────────────────────────────────────

type Query {
  # Models
  listModels: ModelList!
  retrieveModel(model: String!): Model!

  # Files
  listFiles(purpose: FilePurpose, limit: Int, order: String, after: String): FileList!
  retrieveFile(file_id: String!): File!
  retrieveFileContent(file_id: String!): String!

  # Fine-Tuning
  listFineTuningJobs(after: String, limit: Int): FineTuningJobList!
  retrieveFineTuningJob(fine_tuning_job_id: String!): FineTuningJob!
  listFineTuningEvents(fine_tuning_job_id: String!, after: String, limit: Int): FineTuningEventList!
  listFineTuningCheckpoints(fine_tuning_job_id: String!, after: String, limit: Int): FineTuningCheckpointList!

  # Batches
  listBatches(after: String, limit: Int): BatchList!
  retrieveBatch(batch_id: String!): Batch!

  # Assistants
  listAssistants(limit: Int, order: String, after: String, before: String): AssistantList!
  retrieveAssistant(assistant_id: String!): Assistant!

  # Threads
  retrieveThread(thread_id: String!): Thread!

  # Messages
  listMessages(thread_id: String!, limit: Int, order: String, after: String, before: String, run_id: String): MessageList!
  retrieveMessage(thread_id: String!, message_id: String!): Message!

  # Runs
  listRuns(thread_id: String!, limit: Int, order: String, after: String, before: String): RunList!
  retrieveRun(thread_id: String!, run_id: String!): Run!
  listRunSteps(thread_id: String!, run_id: String!, limit: Int, order: String, after: String, before: String): RunStepList!
  retrieveRunStep(thread_id: String!, run_id: String!, step_id: String!): RunStep!

  # Vector Stores
  listVectorStores(limit: Int, order: String, after: String, before: String): VectorStoreList!
  retrieveVectorStore(vector_store_id: String!): VectorStore!
  listVectorStoreFiles(vector_store_id: String!, limit: Int, order: String, after: String, before: String, filter: String): VectorStoreFileList!
  retrieveVectorStoreFile(vector_store_id: String!, file_id: String!): VectorStoreFile!
  retrieveVectorStoreFileBatch(vector_store_id: String!, batch_id: String!): VectorStoreFileBatch!
  listFilesInVectorStoreFileBatch(vector_store_id: String!, batch_id: String!, limit: Int, order: String, after: String, before: String, filter: String): VectorStoreFileList!

  # Uploads
  retrieveUpload(upload_id: String!): UploadObject!

  # Administration
  listOrganizationUsers(limit: Int, after: String): OrganizationUserList!
  listProjects(limit: Int, after: String, include_archived: Boolean): ProjectList!
  retrieveProject(project_id: String!): Project!
  listProjectUsers(project_id: String!, limit: Int, after: String): ProjectUserList!
  listProjectApiKeys(project_id: String!, limit: Int, after: String): ApiKeyList!
  retrieveProjectApiKey(project_id: String!, key_id: String!): ApiKey!
  listProjectRateLimits(project_id: String!, limit: Int, after: String, before: String): RateLimitList!
  listAuditLogs(effective_at_gt: Int, effective_at_gte: Int, effective_at_lt: Int, effective_at_lte: Int, project_ids: [String], event_types: [AuditLogEventType], actor_ids: [String], actor_emails: [String], resource_ids: [String], limit: Int, after: String, before: String): AuditLogList!
}

# ─── Mutation ────────────────────────────────────────────────────────────────────

type Mutation {
  # Chat Completions
  createChatCompletion(model: String!, messages: JSON!, temperature: Float, top_p: Float, n: Int, stream: Boolean, stop: JSON, max_completion_tokens: Int, max_tokens: Int, presence_penalty: Float, frequency_penalty: Float, logit_bias: JSON, user: String, tools: JSON, tool_choice: JSON, response_format: JSON, seed: Int, parallel_tool_calls: Boolean, service_tier: String, store: Boolean, metadata: JSON): ChatCompletion!

  # Embeddings
