openapi: 3.2.0
info:
  title: Openai Organization API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Organization across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Organization
paths:
  /organization/admin_api_keys:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: List all organization and project API keys
      description: List organization API keys
      operationId: admin-api-keys-list
      parameters:
      - in: query
        name: after
        required: false
        schema:
          type: string
          nullable: true
          description: Return keys with IDs that come after this ID in the pagination order.
      - in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
          description: Order results by creation time, ascending or descending.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          description: Maximum number of keys to return.
      responses:
        '200':
          description: A list of organization API keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/admin_api_keys?after=key_abc&limit=20 \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"list\",\n  \"data\": [\n    {\n      \"object\": \"organization.admin_api_key\",\n      \"id\": \"key_abc\",\n      \"name\": \"Main Admin Key\",\n      \"redacted_value\": \"sk-admin...def\",\n      \"created_at\": 1711471533,\n      \"expires_at\": 1714063533,\n      \"last_used_at\": 1711471534,\n      \"owner\": {\n        \"type\": \"service_account\",\n        \"object\": \"organization.service_account\",\n        \"id\": \"sa_456\",\n        \"name\": \"My Service Account\",\n        \"created_at\": 1711471533,\n        \"role\": \"member\"\n      }\n    }\n  ],\n  \"first_id\": \"key_abc\",\n  \"last_id\": \"key_abc\",\n  \"has_more\": false\n}\n"
      tags:
      - Organization
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Create admin API key
      description: Create an organization admin API key
      operationId: admin-api-keys-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: New Admin Key
                expires_in_seconds:
                  type: integer
                  minimum: 1
                  maximum: 31536000
                  example: 2592000
                  description: The number of seconds until the API key expires. Omit this field for a key that does not expire.
      responses:
        '200':
          description: The newly created admin API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiKeyCreateResponse'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/admin_api_keys \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n      \"name\": \"New Admin Key\",\n      \"expires_in_seconds\": 2592000\n  }'\n"
          response: "{\n  \"object\": \"organization.admin_api_key\",\n  \"id\": \"key_xyz\",\n  \"name\": \"New Admin Key\",\n  \"redacted_value\": \"sk-admin...xyz\",\n  \"created_at\": 1711471533,\n  \"expires_at\": 1714063533,\n  \"last_used_at\": 1711471534,\n  \"owner\": {\n    \"type\": \"user\",\n    \"object\": \"organization.user\",\n    \"id\": \"user_123\",\n    \"name\": \"John Doe\",\n    \"created_at\": 1711471533,\n    \"role\": \"owner\"\n  },\n  \"value\": \"sk-admin-1234abcd\"\n}\n"
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/admin_api_keys/{key_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieve admin API key
      description: Retrieve a single organization API key
      operationId: admin-api-keys-get
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          type: string
          description: The ID of the API key.
      responses:
        '200':
          description: Details of the requested API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiKey'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/admin_api_keys/key_abc \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"organization.admin_api_key\",\n  \"id\": \"key_abc\",\n  \"name\": \"Main Admin Key\",\n  \"redacted_value\": \"sk-admin...xyz\",\n  \"created_at\": 1711471533,\n  \"last_used_at\": 1711471534,\n  \"owner\": {\n    \"type\": \"user\",\n    \"object\": \"organization.user\",\n    \"id\": \"user_123\",\n    \"name\": \"John Doe\",\n    \"created_at\": 1711471533,\n    \"role\": \"owner\"\n  }\n}\n"
      tags:
      - Organization
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Delete admin API key
      description: Delete an organization admin API key
      operationId: admin-api-keys-delete
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          type: string
          description: The ID of the API key to be deleted.
      responses:
        '200':
          description: Confirmation that the API key was deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: key_abc
                  object:
                    type: string
                    enum:
                    - organization.admin_api_key.deleted
                    example: organization.admin_api_key.deleted
                    x-stainless-const: true
                  deleted:
                    type: boolean
                    example: true
                required:
                - id
                - object
                - deleted
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X DELETE https://api.openai.com/v1/organization/admin_api_keys/key_abc \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"id\": \"key_abc\",\n  \"object\": \"organization.admin_api_key.deleted\",\n  \"deleted\": true\n}\n"
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/external_storage:
    get:
      summary: List external storage configurations
      description: List the organization's customer-managed external storage configurations.
      operationId: Listexternalstorageconfigurations
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - example: proj_123
            type: string
          - type: 'null'
      - name: after
        in: query
        description: Return external storage configurations after this ID.
        required: false
        schema:
          anyOf:
          - description: Return external storage configurations after this ID.
            type: string
          - type: 'null'
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ExternalStorageOrder'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalStorageListResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl \"https://api.openai.com/v1/organization/external_storage?limit=20&order=desc\" \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"list\",\n  \"data\": [\n    {\n      \"object\": \"organization.external_storage\",\n      \"id\": \"extstorage_abc123\",\n      \"project_id\": \"proj_abc123\",\n      \"provider\": {\n        \"type\": \"aws\",\n        \"account_id\": \"123456789012\",\n        \"region\": \"us-east-1\",\n        \"bucket\": \"customer-logs\",\n        \"role_arn\": \"arn:aws:iam::123456789012:role/OpenAIExternalStorageRole\",\n        \"external_id\": \"proj_abc123\"\n      },\n      \"geography\": \"US\",\n      \"status\": \"validated\",\n      \"created_at\": 1711471533\n    },\n    {\n      \"object\": \"organization.external_storage\",\n      \"id\": \"extstorage_azure123\",\n      \"project_id\": \"proj_azure123\",\n      \"provider\": {\n        \"type\": \"azure\",\n        \"tenant_id\": \"11111111-1111-1111-1111-111111111111\",\n        \"subscription_id\": \"22222222-2222-2222-2222-222222222222\",\n        \"resource_group\": \"customer-rg\",\n        \"account_name\": \"customerstorage\",\n        \"container\": \"openai-data\",\n        \"region\": \"eastus\"\n      },\n      \"geography\": \"US\",\n      \"status\": \"validated\",\n      \"created_at\": 1711471500\n    }\n  ],\n  \"first_id\": \"extstorage_abc123\",\n  \"last_id\": \"extstorage_azure123\",\n  \"has_more\": false\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    post:
      summary: Create an external storage configuration
      description: Register one customer-managed external storage configuration.
      operationId: Createanexternalstorageconfiguration
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalStorageBody'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalStorageResponse'
      x-oaiMeta:
        group: administration
        examples:
        - title: AWS S3
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/external_storage \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"project_id\": \"proj_abc123\",\n    \"provider\": {\n      \"type\": \"aws\",\n      \"bucket\": \"customer-logs\",\n      \"role_arn\": \"arn:aws:iam::123456789012:role/OpenAIExternalStorageRole\"\n    }\n  }'\n"
          response: "{\n  \"object\": \"organization.external_storage\",\n  \"id\": \"extstorage_abc123\",\n  \"project_id\": \"proj_abc123\",\n  \"provider\": {\n    \"type\": \"aws\",\n    \"account_id\": \"123456789012\",\n    \"region\": \"us-east-1\",\n    \"bucket\": \"customer-logs\",\n    \"role_arn\": \"arn:aws:iam::123456789012:role/OpenAIExternalStorageRole\",\n    \"external_id\": \"proj_abc123\"\n  },\n  \"geography\": \"US\",\n  \"status\": \"pending\",\n  \"created_at\": 1711471533\n}\n"
        - title: Azure Blob Storage
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/external_storage \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"project_id\": \"proj_azure123\",\n    \"provider\": {\n      \"type\": \"azure\",\n      \"tenant_id\": \"11111111-1111-1111-1111-111111111111\",\n      \"subscription_id\": \"22222222-2222-2222-2222-222222222222\",\n      \"resource_group\": \"customer-rg\",\n      \"account_name\": \"customerstorage\",\n      \"container\": \"openai-data\"\n    }\n  }'\n"
          response: "{\n  \"object\": \"organization.external_storage\",\n  \"id\": \"extstorage_azure123\",\n  \"project_id\": \"proj_azure123\",\n  \"provider\": {\n    \"type\": \"azure\",\n    \"tenant_id\": \"11111111-1111-1111-1111-111111111111\",\n    \"subscription_id\": \"22222222-2222-2222-2222-222222222222\",\n    \"resource_group\": \"customer-rg\",\n    \"account_name\": \"customerstorage\",\n    \"container\": \"openai-data\",\n    \"region\": \"eastus\"\n  },\n  \"geography\": \"US\",\n  \"status\": \"pending\",\n  \"created_at\": 1711471533\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/external_storage/{external_storage_id}:
    get:
      summary: Get an external storage configuration
      description: Get one customer-managed external storage configuration.
      operationId: Getanexternalstorageconfiguration
      parameters:
      - name: external_storage_id
        in: path
        required: true
        schema:
          example: extstorage_123
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalStorageResponse'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/external_storage/extstorage_azure123 \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"organization.external_storage\",\n  \"id\": \"extstorage_azure123\",\n  \"project_id\": \"proj_azure123\",\n  \"provider\": {\n    \"type\": \"azure\",\n    \"tenant_id\": \"11111111-1111-1111-1111-111111111111\",\n    \"subscription_id\": \"22222222-2222-2222-2222-222222222222\",\n    \"resource_group\": \"customer-rg\",\n    \"account_name\": \"customerstorage\",\n    \"container\": \"openai-data\",\n    \"region\": \"eastus\"\n  },\n  \"geography\": \"US\",\n  \"status\": \"validated\",\n  \"created_at\": 1711471533\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    delete:
      summary: Delete an external storage configuration
      description: Disconnect a customer-managed external storage configuration. Removing the project's last configuration restores organization-default retention if customer-managed retention was active. Repeating a deletion also completes any interrupted retention update. Cloud storage is unchanged.
      operationId: Deleteanexternalstorageconfiguration
      parameters:
      - name: external_storage_id
        in: path
        required: true
        schema:
          example: extstorage_123
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalStorageDeletedResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X DELETE https://api.openai.com/v1/organization/external_storage/extstorage_abc123 \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"organization.external_storage.deleted\",\n  \"id\": \"extstorage_abc123\",\n  \"deleted\": true\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/external_storage/{external_storage_id}/validate:
    post:
      summary: Validate an external storage configuration
      description: Validate one customer-managed external storage configuration.
      operationId: Validateanexternalstorageconfiguration
      parameters:
      - name: external_storage_id
        in: path
        required: true
        schema:
          example: extstorage_123
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalStorageResponse'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/external_storage/extstorage_azure123/validate \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n  \"object\": \"organization.external_storage\",\n  \"id\": \"extstorage_azure123\",\n  \"project_id\": \"proj_azure123\",\n  \"provider\": {\n    \"type\": \"azure\",\n    \"tenant_id\": \"11111111-1111-1111-1111-111111111111\",\n    \"subscription_id\": \"22222222-2222-2222-2222-222222222222\",\n    \"resource_group\": \"customer-rg\",\n    \"account_name\": \"customerstorage\",\n    \"container\": \"openai-data\",\n    \"region\": \"eastus\"\n  },\n  \"geography\": \"US\",\n  \"status\": \"validated\",\n  \"created_at\": 1711471533\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/spend_limit:
    get:
      summary: Get organization spend limit
      description: Get the organization's hard spend limit.
      operationId: Getorganizationspendlimit
      parameters: []
      responses:
        '200':
          description: Hard spend limit retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSpendLimitResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"organization.spend_limit\",\n    \"threshold_amount\": 10000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"enforcement\": {\n        \"status\": \"enforcing\"\n    }\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    post:
      summary: Update organization spend limit
      description: Create or replace the organization's hard spend limit.
      operationId: Updateorganizationspendlimit
      parameters: []
      requestBody:
        description: Parameters for the hard spend limit you want to create or replace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationSpendLimitBody'
        required: true
      responses:
        '200':
          description: Hard spend limit created or replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSpendLimitResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n      \"threshold_amount\": 10000,\n      \"currency\": \"USD\",\n      \"interval\": \"month\"\n  }'\n"
          response: "{\n    \"object\": \"organization.spend_limit\",\n    \"threshold_amount\": 10000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"enforcement\": {\n        \"status\": \"enforcing\"\n    }\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    delete:
      summary: Delete organization spend limit
      description: Delete the organization's hard spend limit.
      operationId: Deleteorganizationspendlimit
      parameters: []
      responses:
        '200':
          description: Hard spend limit deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSpendLimitDeletedResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X DELETE https://api.openai.com/v1/organization/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"organization.spend_limit.deleted\",\n    \"deleted\": true\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/projects/{project_id}/spend_limit:
    get:
      summary: Get project spend limit
      description: Get a project's hard spend limit.
      operationId: Getprojectspendlimit
      parameters:
      - name: project_id
        in: path
        description: The ID of the project whose hard spend limit is being managed.
        required: true
        schema:
          example: proj_123
          type: string
      responses:
        '200':
          description: Hard spend limit retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSpendLimitResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/projects/proj_abc/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"project.spend_limit\",\n    \"threshold_amount\": 10000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"enforcement\": {\n        \"status\": \"enforcing\"\n    }\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    delete:
      summary: Delete project spend limit
      description: Delete a project's hard spend limit.
      operationId: Deleteprojectspendlimit
      parameters:
      - name: project_id
        in: path
        description: The ID of the project whose hard spend limit is being managed.
        required: true
        schema:
          example: proj_123
          type: string
      responses:
        '200':
          description: Hard spend limit deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSpendLimitDeletedResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X DELETE https://api.openai.com/v1/organization/projects/proj_abc/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"project.spend_limit.deleted\",\n    \"deleted\": true\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    post:
      summary: Update project spend limit
      description: Create or replace a project's hard spend limit.
      operationId: Updateprojectspendlimit
      parameters:
      - name: project_id
        in: path
        description: The ID of the project whose hard spend limit is being managed.
        required: true
        schema:
          example: proj_123
          type: string
      requestBody:
        description: Parameters for the hard spend limit you want to create or replace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectSpendLimitBody'
        required: true
      responses:
        '200':
          description: Hard spend limit created or replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSpendLimitResource'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/projects/proj_abc/spend_limit \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n      \"threshold_amount\": 10000,\n      \"currency\": \"USD\",\n      \"interval\": \"month\"\n  }'\n"
          response: "{\n    \"object\": \"project.spend_limit\",\n    \"threshold_amount\": 10000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"enforcement\": {\n        \"status\": \"enforcing\"\n    }\n}\n"
      security:
      - AdminApiKeyAuth: []
      tags:
      - Organization
    servers:
    - url: https://api.openai.com/v1
  /organization/projects/{project_id}/service_accounts/{service_account_id}/api_keys:
    post:
      summary: Create an API key for a service account
      description: Creates an API key for a service account in the project.
      operationId: CreateanAPIkeyforaserviceaccount
      parameters:
      - name: project_id
        in: path
        description: The ID of the project.
        required: true
        schema:
          description: The ID of the project.
          type: string
      - name: service_account_id
        in: path
        description: The ID of the service account.
        required: true
        schema:
          description: The ID of the service account.
          type: string
      requestBody:
        description: The service account API key create request payload.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectServiceAccountApiKeyBody'
      responses:
        '200':
          description: Service account API key created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountApiKeyBody'
      x-oaiMeta:
        group: administration
        examples:
