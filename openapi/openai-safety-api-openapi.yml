openapi: 3.2.0
info:
  title: OpenAI Safety API
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Safety
paths:
  /safety/cases/{id}:
    get:
      summary: Get safety case
      description: Get a safety case by ID.
      operationId: Getsafetycase
      parameters:
      - name: id
        in: path
        description: Safety case ID
        required: true
        schema:
          description: Safety case ID
          type: string
          maxLength: 128
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyCaseResource'
      x-oaiMeta:
        group: safety-cases
        path: retrieve
        examples:
          request:
            curl: "curl https://api.openai.com/v1/safety/cases/C-abc123 \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\"\n"
          response: "{\n  \"id\": \"C-abc123\",\n  \"object\": \"safety.case\",\n  \"created_at\": 1787659200,\n  \"entity_identifier\": \"safety-id-123\",\n  \"reason\": \"cyber_abuse\",\n  \"notice\": {\"type\": \"warning\"}\n}\n"
      tags:
      - Safety
  /safety/alerts/{id}:
    get:
      summary: Get project safety alert
      description: Get a safety alert belonging to the authenticated API project.
      operationId: Getprojectsafetyalert
      parameters:
      - name: id
        in: path
        description: Project safety alert ID
        required: true
        schema:
          description: Project safety alert ID
          type: string
          maxLength: 38
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyAlertResource'
      x-oaiMeta:
        group: safety-alerts
        path: retrieve
        examples:
          request:
            curl: "curl https://api.openai.com/v1/safety/alerts/alert_0123456789abcdef0123456789abcdef \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\"\n"
          response: "{\n  \"id\": \"alert_0123456789abcdef0123456789abcdef\",\n  \"object\": \"safety.alert\",\n  \"created_at\": 1787659200,\n  \"request_id\": \"req_123\",\n  \"response_id\": \"resp_123\",\n  \"model\": \"gpt-6-astra\",\n  \"request_paused\": true,\n  \"error_type\": \"potentially_unintended_data_access\",\n  \"reason\": \"Potentially unintended data access.\"\n}\n"
      tags:
      - Safety
components:
  schemas:
    SafetyAlertResource:
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - safety.alert
          default: safety.alert
          x-stainless-const: true
        created_at:
          type: integer
          format: unixtime
        request_id:
          type: string
        response_id:
          type: string
        model:
          type: string
        request_paused:
          type: boolean
          description: Whether block registration succeeded for this request. This does not confirm that response execution stopped.
        error_type:
          $ref: '#/components/schemas/SafetyAlertErrorType'
        reason:
          anyOf:
          - type: string
            description: A customer-safe description derived from error_type, or null for zero data retention requests.
          - type: 'null'
      type: object
      required:
      - id
      - object
      - created_at
      - request_id
      - response_id
      - model
      - request_paused
      - error_type
      - reason
    SafetyCaseNotice:
      properties:
        type:
          $ref: '#/components/schemas/SafetyCaseNoticeType'
      type: object
      required:
      - type
    SafetyAlertErrorType:
      type: string
      enum:
      - potentially_unintended_data_transfer
      - potentially_unintended_data_access
      - potentially_unintended_destructive_activity
      - other
    SafetyCaseResource:
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - safety.case
          default: safety.case
          x-stainless-const: true
        created_at:
          type: integer
          format: unixtime
        entity_identifier:
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
        notice:
          $ref: '#/components/schemas/SafetyCaseNotice'
      type: object
      required:
      - id
      - object
      - created_at
      - entity_identifier
      - reason
      - notice
    SafetyCaseNoticeType:
      type: string
      enum:
      - warning
      - deactivation
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
