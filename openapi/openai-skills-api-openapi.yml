            python: "import os\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=os.environ.get(\"OPENAI_API_KEY\"),  # This is the default and can be omitted\n)\ncontent = client.skills.content.retrieve(\n    \"skill_123\",\n)\nprint(content)\ndata = content.read()\nprint(data)"
