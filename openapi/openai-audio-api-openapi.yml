      - object
      - id
      - name
      - language
      - created_at
      x-oaiMeta:
        name: The voice consent object
        example: "{\n  \"object\": \"audio.voice_consent\",\n  \"id\": \"cons_1234\",\n  \"name\": \"John Doe\",\n  \"language\": \"en-US\",\n  \"created_at\": 1734220800\n}\n"
