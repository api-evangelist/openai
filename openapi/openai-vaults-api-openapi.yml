        description: The ID of the vault.
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The ID of the vault credential.
      responses:
        '200':
          description: The deleted vault credential.
          content:
            application/json:
              schema:
