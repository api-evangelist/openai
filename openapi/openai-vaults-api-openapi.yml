components:
  schemas:
    VaultCredentialNetworkingParamUnrestricted:
      type: object
      properties:
        type:
          type: string
          enum:
          - unrestricted
          default: unrestricted
          x-stainless-const: true
          description: The type of the object. Always `unrestricted`.
      required:
      - type
      additionalProperties: false
      description: Allows substitution for destinations permitted by the environment network policy. Requires `environment.network.access` to be `restricted`, with explicit `allowed_domains`.
    CreateMcpOauthRefreshParam:
      type: object
      properties:
        token_endpoint:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The HTTPS OAuth token endpoint used to exchange the refresh token for a new access token.
        client_id:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The OAuth client ID used when requesting a new access token.
        resource:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 1048576
          description: The resource URI to send to the OAuth token endpoint during refresh, if required.
        scope:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 1048576
          description: Space-separated OAuth scopes to request during refresh, if required.
        refresh_token:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The refresh token to store. This secret is never returned in credential resources.
        token_endpoint_auth:
          $ref: '#/components/schemas/CreateMcpOauthTokenEndpointAuthParam'
          description: How the OAuth client authenticates to the token endpoint.
      required:
      - token_endpoint
      - client_id
      - refresh_token
      - token_endpoint_auth
      additionalProperties: false
      description: Configuration for refreshing the access token of an MCP OAuth credential.
    McpOauthRefreshResource:
      type: object
      properties:
        token_endpoint:
          type: string
          minLength: 0
          description: The HTTPS OAuth token endpoint used for refresh.
        client_id:
          type: string
          minLength: 0
          description: The OAuth client ID used when requesting a new access token.
        resource:
          type:
          - string
          - 'null'
          minLength: 0
          description: The resource URI sent to the OAuth token endpoint during refresh, if configured.
        scope:
          type:
          - string
          - 'null'
          minLength: 0
          description: Space-separated OAuth scopes requested during refresh, if configured.
        token_endpoint_auth:
          $ref: '#/components/schemas/McpOauthTokenEndpointAuthResource'
          description: How the OAuth client authenticates to the token endpoint, excluding its client secret.
      required:
      - token_endpoint
      - client_id
      - resource
      - scope
      - token_endpoint_auth
      additionalProperties: false
      description: Configuration used to refresh an MCP OAuth access token, excluding secret values.
    McpOauthTokenEndpointAuthResource:
      oneOf:
      - $ref: '#/components/schemas/McpOauthTokenEndpointAuthResourceNone'
      - $ref: '#/components/schemas/McpOauthTokenEndpointAuthResourceClientSecretBasic'
      - $ref: '#/components/schemas/McpOauthTokenEndpointAuthResourceClientSecretPost'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/McpOauthTokenEndpointAuthResourceNone'
          client_secret_basic: '#/components/schemas/McpOauthTokenEndpointAuthResourceClientSecretBasic'
          client_secret_post: '#/components/schemas/McpOauthTokenEndpointAuthResourceClientSecretPost'
      x-oai-discriminator-values:
      - none
      - client_secret_basic
      - client_secret_post
      description: The client authentication method used for OAuth token refresh.
    VaultCredentialNetworkingResourceUnrestricted:
      type: object
      properties:
        type:
          type: string
          enum:
          - unrestricted
          default: unrestricted
          x-stainless-const: true
          description: The type of the object. Always `unrestricted`.
      required:
      - type
      additionalProperties: false
      description: Allows substitution for destinations permitted by the environment network policy. Requires `environment.network.access` to be `restricted`, with explicit `allowed_domains`.
    RotateVaultCredentialAuthParamEnvironmentVariable:
      type: object
      properties:
        type:
          type: string
          enum:
          - environment_variable
          default: environment_variable
          x-stainless-const: true
          description: The type of the object. Always `environment_variable`.
        secret_value:
          type: string
          minLength: 1
          maxLength: 1048576
          description: The write-only replacement secret. Never returned in credential resources or supplied directly to sandbox code. Must be nonempty and must not contain carriage returns, newlines, or NUL bytes.
      required:
      - type
      - secret_value
      additionalProperties: false
      description: Replace the secret for an OpenAI-hosted environment credential. The environment variable name and networking configuration remain unchanged.
    CreateVaultCredentialAuthParam:
      oneOf:
