      - name: after
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: Return resources after this resource ID in the selected order.
      responses:
        '200':
          description: A page of vault credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultCredentialListResource'
                description: A page of credentials in a vault.
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '401':
          description: Authentication or project context was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '403':
          description: The API key lacks the required management permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '404':
          description: The requested vault or credential was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '409':
          description: The request conflicted with the current vault state.
          content:
            application/json:
