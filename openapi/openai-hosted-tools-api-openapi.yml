openapi: 3.2.0
info:
  title: Openai Hosted tools API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Hosted tools across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Hosted tools
paths:
  /organization/projects/{project_id}/hosted_tool_permissions:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieve project hosted tool permissions
      description: Returns hosted tool permissions for a project.
      operationId: retrieve-project-hosted-tool-permissions
      tags:
      - Hosted tools
      parameters:
      - name: project_id
        in: path
        description: The ID of the project.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Project hosted tool permissions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHostedToolPermissions'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/projects/proj_abc/hosted_tool_permissions \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"file_search\": {\n        \"enabled\": true\n    },\n    \"web_search\": {\n        \"enabled\": true\n    },\n    \"image_generation\": {\n        \"enabled\": true\n    },\n    \"mcp\": {\n        \"enabled\": true\n    },\n    \"code_interpreter\": {\n        \"enabled\": true\n    }\n}\n"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Modify project hosted tool permissions
      description: Updates hosted tool permissions for a project.
      operationId: update-project-hosted-tool-permissions
      tags:
      - Hosted tools
      parameters:
      - name: project_id
        in: path
        description: The ID of the project.
        required: true
        schema:
          type: string
      requestBody:
        description: The project hosted tool permissions update request payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectHostedToolPermissionsUpdateRequest'
      responses:
        '200':
          description: Project hosted tool permissions updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHostedToolPermissions'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/projects/proj_abc/hosted_tool_permissions \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n      \"file_search\": {\n          \"enabled\": true\n      },\n      \"image_generation\": {\n          \"enabled\": false\n      }\n  }'\n"
          response: "{\n    \"file_search\": {\n        \"enabled\": true\n    },\n    \"web_search\": {\n        \"enabled\": true\n    },\n    \"image_generation\": {\n        \"enabled\": false\n    },\n    \"mcp\": {\n        \"enabled\": true\n    },\n    \"code_interpreter\": {\n        \"enabled\": true\n    }\n}\n"
    servers:
    - url: https://api.openai.com/v1
components:
  schemas:
    HostedToolPermission:
      type: object
      description: Permission state for a single hosted tool on a project.
      properties:
        enabled:
          type: boolean
          description: Whether the hosted tool is enabled for the project.
      required:
      - enabled
    ProjectHostedToolPermissions:
      type: object
      description: Represents hosted tool permissions for a project.
      properties:
        file_search:
          $ref: '#/components/schemas/HostedToolPermission'
        web_search:
          $ref: '#/components/schemas/HostedToolPermission'
        image_generation:
          $ref: '#/components/schemas/HostedToolPermission'
        mcp:
          $ref: '#/components/schemas/HostedToolPermission'
        code_interpreter:
          $ref: '#/components/schemas/HostedToolPermission'
      required:
      - file_search
      - web_search
      - image_generation
      - mcp
      - code_interpreter
      x-oaiMeta:
        name: The project hosted tool permissions object
        example: "{\n    \"file_search\": {\n        \"enabled\": true\n    },\n    \"web_search\": {\n        \"enabled\": true\n    },\n    \"image_generation\": {\n        \"enabled\": true\n    },\n    \"mcp\": {\n        \"enabled\": true\n    },\n    \"code_interpreter\": {\n        \"enabled\": true\n    }\n}\n"
    HostedToolPermissionUpdate:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether to enable the hosted tool for the project.
      required:
      - enabled
    ProjectHostedToolPermissionsUpdateRequest:
      type: object
      properties:
        file_search:
          anyOf:
          - $ref: '#/components/schemas/HostedToolPermissionUpdate'
          - type: 'null'
          description: The file search permission update.
        web_search:
          anyOf:
          - $ref: '#/components/schemas/HostedToolPermissionUpdate'
          - type: 'null'
          description: The web search permission update.
        image_generation:
          anyOf:
          - $ref: '#/components/schemas/HostedToolPermissionUpdate'
          - type: 'null'
          description: The image generation permission update.
        mcp:
          anyOf:
          - $ref: '#/components/schemas/HostedToolPermissionUpdate'
          - type: 'null'
          description: The MCP permission update.
        code_interpreter:
          anyOf:
          - $ref: '#/components/schemas/HostedToolPermissionUpdate'
          - type: 'null'
          description: The code interpreter permission update.
    _MisalignmentErrorType:
      anyOf:
      - type: string
      - type: string
        enum:
        - potentially_unintended_data_transfer
        - potentially_unintended_data_access
        - potentially_unintended_destructive_activity
        - other
    MisalignmentErrorDetailsResource:
      properties:
        review_target:
          anyOf:
          - not:
              pattern: '[^A-Za-z0-9._~:-]'
            type: string
            maxLength: 96
            minLength: 1
            pattern: ^[A-Za-z0-9._~:-]+$
            description: An opaque target for explicitly continuing this review, or null when unavailable.
          - type: 'null'
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
    Error:
      type: object
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
        message:
          type: string
        param:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        misalignment:
          $ref: '#/components/schemas/MisalignmentErrorDetailsResource'
      required:
      - type
      - message
      - param
      - code
    PermissionErrorResponse:
      type: object
      properties:
        error:
          description: Details about the permission error.
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: string
            description: An explanation of the missing API permissions.
      required:
      - error
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
x-refined-from:
- openai-openapi-master-2026-09-23.yml
- openai-openapi-master-2026-10-12.yml
