openapi: 3.2.0
info:
  title: Openai Content Provenance Checks API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Content Provenance Checks across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Content Provenance Checks
paths:
  /content_provenance_checks:
    post:
      summary: Create content provenance check
      description: 'Check whether an image or audio file contains known OpenAI provenance signals. Learn more about content provenance.


        If `not_detected`, it means the tool did not find supported signals in the uploaded file. The content could still have been generated by OpenAI if the metadata was stripped or has evidence of tampering, the watermark was degraded, it comes from a legacy generation model, or it was created before provenance signals were available. Content could also still be AI-generated by another company''s model, which the tool currently does not detect.'
      operationId: Createcontentprovenancecheck
      parameters: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContentProvenanceBody'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceResource'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-oaiMeta:
        group: content_provenance_checks
        examples: []
      tags:
      - Content Provenance Checks
    servers:
    - url: https://api.openai.com/v1
components:
  schemas:
    CreateContentProvenanceBody:
      properties:
        file:
          type: string
          format: binary
          description: The image or audio file to check for supported OpenAI provenance signals.
      type: object
      required:
      - file
    ProvenanceResource:
      properties:
        object:
          $ref: '#/components/schemas/ProvenanceCheckObject'
          description: The object type. Always `content_provenance_check` for this endpoint.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp, in seconds, when the provenance check was created.
        results:
          items:
            oneOf:
            - $ref: '#/components/schemas/C2PAProvenanceResult'
            - $ref: '#/components/schemas/SynthIDProvenanceResult'
            discriminator:
              propertyName: type
          type: array
          description: The provenance results that apply to the uploaded file. Image results include C2PA and SynthID; audio results include SynthID.
      type: object
      required:
      - object
      - created_at
      - results
    Error:
      type: object
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
        message:
          type: string
        param:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        misalignment:
          $ref: '#/components/schemas/MisalignmentErrorDetailsResource'
      required:
      - type
      - message
      - param
      - code
    _MisalignmentErrorType:
      anyOf:
      - type: string
      - type: string
        enum:
        - potentially_unintended_data_transfer
        - potentially_unintended_data_access
        - potentially_unintended_destructive_activity
        - other
    C2PAValidationStateApi:
      type: string
      enum:
      - trusted
      - valid
      - invalid
      - not_present
    ProvenanceDetectionResultApi:
      type: string
      enum:
      - detected
      - not_detected
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
      - message
    C2PAProvenanceResult:
      properties:
        type:
          type: string
          enum:
          - c2pa
          description: The provenance signal type. Always `c2pa`.
          default: c2pa
          x-stainless-const: true
        outcome:
          $ref: '#/components/schemas/ProvenanceDetectionResultApi'
          description: 'Whether a supported OpenAI C2PA provenance signal was detected.

            If `not_detected`, it means the tool did not find supported signals in the uploaded file. The content could still have been generated by OpenAI if the metadata was stripped or has evidence of tampering, the watermark was degraded, it comes from a legacy generation model, or it was created before provenance signals were available. Content could also still be AI-generated by another company''s model, which the tool currently does not detect.'
        validation_state:
          $ref: '#/components/schemas/C2PAValidationStateApi'
          description: The validation status of the C2PA manifest in the uploaded image.
        issuer:
          anyOf:
          - type: string
            description: The C2PA manifest issuer, when available.
          - type: 'null'
        model:
          anyOf:
          - type: string
            description: The OpenAI model recorded by the provenance signal, when available.
          - type: 'null'
        generated_at:
          anyOf:
          - type: string
            description: The UTC RFC 3339 timestamp recorded by the provenance signal for when the asset was generated, when available.
          - type: 'null'
      type: object
      required:
      - type
      - outcome
      - validation_state
      - issuer
      - model
      - generated_at
    MisalignmentErrorDetailsResource:
      properties:
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
    SynthIDProvenanceResult:
      properties:
        type:
          type: string
          enum:
          - synthid
          description: The provenance signal type. Always `synthid`.
          default: synthid
          x-stainless-const: true
        outcome:
          $ref: '#/components/schemas/ProvenanceDetectionResultApi'
          description: 'Whether a supported OpenAI SynthID watermark was detected.

            If `not_detected`, it means the tool did not find supported signals in the uploaded file. The content could still have been generated by OpenAI if the metadata was stripped or has evidence of tampering, the watermark was degraded, it comes from a legacy generation model, or it was created before provenance signals were available. Content could also still be AI-generated by another company''s model, which the tool currently does not detect.'
        model:
          anyOf:
          - type: string
            description: The OpenAI model recorded by the provenance signal, when available.
          - type: 'null'
        generated_at:
          anyOf:
          - type: string
            description: The UTC RFC 3339 timestamp recorded by the provenance signal for when the asset was generated, when available.
          - type: 'null'
      type: object
      required:
      - type
      - outcome
      - model
      - generated_at
    ProvenanceCheckObject:
      type: string
      enum:
      - content_provenance_check
    MisalignmentErrorDetailsResource_2:
      properties:
        review_target:
          anyOf:
          - not:
              pattern: '[^A-Za-z0-9._~:-]'
            type: string
            maxLength: 96
            minLength: 1
            pattern: ^[A-Za-z0-9._~:-]+$
            description: An opaque target for explicitly continuing this review, or null when unavailable.
          - type: 'null'
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
  responses:
    TooManyRequests:
      description: The request was rejected because a rate limit was exceeded.
      headers:
        Retry-After:
          description: The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
x-refined-from:
- openai-openapi-master-2026-09-23.yml
- openai-openapi-master-2026-10-12.yml
