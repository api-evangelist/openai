      description: "An object specifying the format that the model must output.\n\nConfiguring `{ \"type\": \"json_schema\" }` enables Structured Outputs, \nwhich ensures the model will match your supplied JSON schema. Learn more in the \n[Structured Outputs guide](/docs/guides/structured-outputs).\n\nThe default format is `{ \"type\": \"text\" }` with no additional options.\n\n**Not recommended for gpt-4o and newer models:**\n\nSetting to `{ \"type\": \"json_object\" }` enables the older JSON mode, which\nensures the message the model generates is valid JSON. Using `json_schema`\nis preferred for models that support it.\n"
      oneOf:
      - $ref: '#/components/schemas/ResponseFormatText'
      - $ref: '#/components/schemas/TextResponseFormatJsonSchema'
      - $ref: '#/components/schemas/ResponseFormatJsonObject'
    ImageDetail:
      type: string
      enum:
      - low
      - high
      - auto
      - original
    WebSearchApproximateLocation:
      anyOf:
      - type: object
        title: Web search approximate location
        description: 'The approximate location of the user.

          '
        properties:
          type:
            type: string
            enum:
            - approximate
            description: The type of location approximation. Always `approximate`.
            default: approximate
            x-stainless-const: true
          country:
            anyOf:
            - type: string
              description: The two-letter [ISO country code](https://en.wikipedia.org/wiki/ISO_3166-1) of the user, e.g. `US`.
            - type: 'null'
          region:
            anyOf:
            - type: string
              description: Free text input for the region of the user, e.g. `California`.
            - type: 'null'
          city:
            anyOf:
            - type: string
              description: Free text input for the city of the user, e.g. `San Francisco`.
            - type: 'null'
          timezone:
            anyOf:
            - type: string
              description: The [IANA timezone](https://timeapi.io/documentation/iana-timezones) of the user, e.g. `America/Los_Angeles`.
            - type: 'null'
      - type: 'null'
    EvalJsonlFileIdSource:
      type: object
      title: EvalJsonlFileIdSource
      properties:
        type:
          type: string
          enum:
          - file_id
          default: file_id
          description: The type of jsonl source. Always `file_id`.
          x-stainless-const: true
        id:
          type: string
          description: The identifier of the file.
      required:
      - type
      - id
    ResponseFormatJsonSchemaSchema:
      type: object
      title: JSON schema
      description: 'The schema for the response format, described as a JSON Schema object.

        Learn how to build JSON schemas [here](https://json-schema.org/).

        '
      additionalProperties: true
    ContainerReferenceParam:
      properties:
        type:
          type: string
          enum:
          - container_reference
          description: References a container created with the /v1/containers endpoint
          default: container_reference
          x-stainless-const: true
        container_id:
          type: string
          description: The ID of the referenced container.
          example: cntr_123
      type: object
      required:
      - type
      - container_id
    CreateEvalItem:
      title: CreateEvalItem
      description: A chat message that makes up the prompt or context. May include variable references to the `item` namespace, ie {{item.name}}.
      type: object
      oneOf:
      - type: object
        title: SimpleInputMessage
        properties:
          role:
            type: string
            description: The role of the message (e.g. "system", "assistant", "user").
          content:
            type: string
            description: The content of the message.
        required:
        - role
        - content
      - $ref: '#/components/schemas/EvalItem'
      x-oaiMeta:
        name: The chat message object used to configure an individual run
    CustomGrammarFormatParam:
      properties:
        type:
          type: string
          enum:
          - grammar
          description: Grammar format. Always `grammar`.
          default: grammar
          x-stainless-const: true
        syntax:
          $ref: '#/components/schemas/GrammarSyntax1'
          description: The syntax of the grammar definition. One of `lark` or `regex`.
        definition:
          type: string
          description: The grammar definition.
      type: object
      required:
      - type
      - syntax
      - definition
      title: Grammar format
      description: A grammar defined by the user.
    ImageGenTool:
      type: object
      title: Image generation tool
      description: 'A tool that generates images using the GPT image models.

        '
      properties:
        type:
          type: string
          enum:
          - image_generation
          description: 'The type of the image generation tool. Always `image_generation`.

            '
          x-stainless-const: true
        model:
          anyOf:
          - type: string
          - type: string
            enum:
            - gpt-image-1
            - gpt-image-1-mini
            - gpt-image-1.5
            description: 'The image generation model to use. Default: `gpt-image-1`.

              '
            default: gpt-image-1
        quality:
          type: string
          enum:
          - low
          - medium
          - high
          - auto
          description: 'The quality of the generated image. One of `low`, `medium`, `high`,

            or `auto`. Default: `auto`.

            '
          default: auto
        size:
          anyOf:
          - type: string
          - type: string
            enum:
            - 1024x1024
            - 1024x1536
            - 1536x1024
            - auto
          description: The size of the generated images. For `gpt-image-2` and `gpt-image-2-2026-04-21`, arbitrary resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size must also satisfy the model's current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`, and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use one of `1024x1024`, `1792x1024`, or `1024x1792`.
          default: auto
        output_format:
          type: string
          enum:
          - png
          - webp
          - jpeg
          description: 'The output format of the generated image. One of `png`, `webp`, or

            `jpeg`. Default: `png`.

            '
          default: png
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
          description: 'Compression level for the output image. Default: 100.

            '
          default: 100
        moderation:
          type: string
          enum:
          - auto
          - low
          description: 'Moderation level for the generated image. Default: `auto`.

            '
          default: auto
        background:
          type: string
          enum:
          - transparent
          - opaque
          - auto
          description: 'Background type for the generated image. One of `transparent`,

            `opaque`, or `auto`. Default: `auto`.

            '
          default: auto
        input_fidelity:
          anyOf:
          - $ref: '#/components/schemas/InputFidelity'
          - type: 'null'
        input_image_mask:
          type: object
          description: 'Optional mask for inpainting. Contains `image_url`

            (string, optional) and `file_id` (string, optional).

            '
          properties:
            image_url:
              type: string
              description: 'Base64-encoded mask image.

                '
            file_id:
              type: string
              description: 'File ID for the mask image.

                '
          required: []
          additionalProperties: false
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
          description: 'Number of partial images to generate in streaming mode, from 0 (default value) to 3.

            '
          default: 0
        action:
          description: 'Whether to generate a new image or edit an existing image. Default: `auto`.

            '
          $ref: '#/components/schemas/ImageGenActionEnum'
      required:
      - type
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
