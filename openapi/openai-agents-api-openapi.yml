openapi: 3.2.0
info:
  title: Openai Agents API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Agents
paths:
  /agents/environments/{environment_id}:
    get:
      operationId: retrieveAgentEnvironment
      summary: Retrieve an agent environment
      description: Retrieves an execution environment's connection status and safe installed metadata. See environment lifecycle.
      tags:
      - Agents
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The ID of the environment.
      responses:
        '200':
          description: The requested environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEnvironmentResource'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '401':
          description: Authentication or project context was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '404':
          description: The requested session or event was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '409':
          description: The request conflicted with the current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
    servers:
    - url: https://api.openai.com/v1
  /agents/environments/{environment_id}/files:
    get:
      operationId: listAgentEnvironmentFiles
      summary: List agent environment files
      description: Lists live files on a connected execution environment with optional directory filtering and opaque cursor pagination. See environment files.
      tags:
      - Agents
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The ID of the environment.
      - name: path
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 1048576
        description: Restrict the listing to this absolute workspace directory.
      - name: limit
        in: query
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          maximum: 100
        description: The maximum number of files to return, between 1 and 100.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ListOrderParam'
        description: Sort by case-sensitive path components. Defaults to descending.
      - name: page
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The opaque token from the previous page. Keep the same path, order, and limit.
      responses:
        '200':
          description: A page of live environment files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentFileListResource'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '401':
          description: Authentication or project context was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '404':
          description: The requested session or event was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '409':
          description: The request conflicted with the current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
    post:
      operationId: createAgentEnvironmentFile
      summary: Create an agent environment file
      description: Copies inline bytes or a Files API file into a connected execution environment. See environment files.
      tags:
      - Agents
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The ID of the environment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedEnvironmentFileParam'
      responses:
        '201':
          description: The created live environment file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentFileResource'
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '401':
          description: Authentication or project context was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '404':
          description: The requested session or event was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '409':
          description: The request conflicted with the current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
    servers:
    - url: https://api.openai.com/v1
  /agents/sessions/{session_id}/subagents:
    get:
      operationId: listAgentSessionSubagents
      summary: List session subagents
      description: Lists subagents in a session, including nested and closed subagents. See subagent workflows.
      tags:
      - Agents
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: The ID of the session.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
        description: The maximum number of resources to return, between 1 and 100. Defaults to 20.
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ListOrderParam'
          default: desc
        description: The order in which resources are returned. Defaults to `desc`.
      - name: after
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 1048576
        description: Return resources after this resource ID in the selected order.
      responses:
        '200':
          description: The requested subagents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                    - list
                    default: list
                    x-stainless-const: true
                    description: The object type, which is always `list`.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubagentResource'
                    minItems: 0
                    maxItems: 2000
                    description: The resources returned in this page, in the requested sort order.
                  first_id:
                    type:
                    - string
                    - 'null'
                    minLength: 0
                    description: The ID of the first resource in `data`, or `null` if the page is empty.
                  last_id:
                    type:
                    - string
                    - 'null'
                    minLength: 0
                    description: The ID of the last resource in `data`, or `null` if the page is empty. Pass this as `after` with the same order and filters.
                  has_more:
                    type: boolean
                    description: Whether there are more resources to retrieve after this page.
                required:
                - object
                - data
                - first_id
                - last_id
                - has_more
                additionalProperties: false
                description: A page of Agents API resources, with IDs for retrieving additional pages.
        '400':
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '401':
          description: Authentication or project context was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '403':
          description: The API key lacks the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '404':
          description: The requested session or event was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '409':
          description: The request conflicted with the current session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse-2'
    servers:
    - url: https://api.openai.com/v1
