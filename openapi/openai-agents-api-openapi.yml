components:
  schemas:
    EnvironmentStatusResource:
      type: string
      enum:
      - pending
      - connected
      - disconnected
      - expired
      - failed
      x-enumDescriptions:
      - ''
      - ''
      - ''
      - ''
      - ''
      description: The public lifecycle status of an execution environment.
    TurnObjectResource:
      type: string
      enum:
      - agent.session.turn
      default: agent.session.turn
      x-stainless-const: true
      description: The object type for a turn.
    SessionEventAgentSessionTurnFailed:
      type: object
      properties:
        type:
          type: string
          enum:
          - agent.session.turn.failed
          default: agent.session.turn.failed
          x-stainless-const: true
          description: The type of the object. Always `agent.session.turn.failed`.
        event_id:
          type: string
          minLength: 0
          description: The unique ID of the event.
        session_id:
          type: string
          minLength: 0
          description: The ID of the session associated with the event.
        turn_id:
          type: string
          minLength: 0
          description: The ID of the turn associated with the event.
        turn:
          $ref: '#/components/schemas/TurnResource'
          description: The failed turn.
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsageResource'
          - type: 'null'
          description: Token usage by the root agent during the turn, when available.
      required:
      - type
      - event_id
      - session_id
      - turn_id
      - turn
      - usage
      additionalProperties: false
      description: Emitted when a turn fails.
    SessionEventAgentSessionTurnOutputTextDelta:
      type: object
      properties:
        type:
          type: string
          enum:
          - agent.session.turn.output_text.delta
          default: agent.session.turn.output_text.delta
          x-stainless-const: true
          description: The type of the object. Always `agent.session.turn.output_text.delta`.
        event_id:
          type: string
          minLength: 0
          description: The unique ID of the event.
        session_id:
          type: string
          minLength: 0
          description: The ID of the session associated with the event.
        turn_id:
          type:
          - string
          - 'null'
          minLength: 0
          description: The ID of the turn associated with the event, when applicable.
        item_id:
          type: string
          minLength: 0
          description: The ID of the message item.
        output_index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The index of the item in the turn output.
        content_index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The index of the content part in the message.
        delta:
          type: string
          minLength: 0
          description: The text that was appended.
      required:
      - type
      - event_id
      - session_id
      - turn_id
      - item_id
      - output_index
      - content_index
      - delta
      additionalProperties: false
      description: Emitted when text is appended to an output text content part.
    AgentOutputItemResource:
      oneOf:
      - $ref: '#/components/schemas/AssistantMessageItemResource'
      - $ref: '#/components/schemas/ReasoningItemResource'
      - $ref: '#/components/schemas/FunctionCallItemResource'
      - $ref: '#/components/schemas/McpCallItemResource'
      - $ref: '#/components/schemas/WebSearchCallItemResource'
      - $ref: '#/components/schemas/CommandExecutionItemResource'
      - $ref: '#/components/schemas/CreateSubagentCallItemResource'
      - $ref: '#/components/schemas/SendSubagentInputCallItemResource'
      - $ref: '#/components/schemas/ResumeSubagentCallItemResource'
      - $ref: '#/components/schemas/WaitForSubagentsCallItemResource'
      - $ref: '#/components/schemas/InterruptSubagentCallItemResource'
      - $ref: '#/components/schemas/CloseSubagentCallItemResource'
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/AssistantMessageItemResource'
          reasoning: '#/components/schemas/ReasoningItemResource'
          function_call: '#/components/schemas/FunctionCallItemResource'
          mcp_call: '#/components/schemas/McpCallItemResource'
          web_search_call: '#/components/schemas/WebSearchCallItemResource'
          command_execution: '#/components/schemas/CommandExecutionItemResource'
          interrupt_subagent_call: '#/components/schemas/InterruptSubagentCallItemResource'
          create_subagent_call: '#/components/schemas/CreateSubagentCallItemResource'
          send_subagent_input_call: '#/components/schemas/SendSubagentInputCallItemResource'
          resume_subagent_call: '#/components/schemas/ResumeSubagentCallItemResource'
          wait_for_subagents_call: '#/components/schemas/WaitForSubagentsCallItemResource'
          close_subagent_call: '#/components/schemas/CloseSubagentCallItemResource'
      x-oai-discriminator-values:
      - message
      - reasoning
      - function_call
      - mcp_call
      - web_search_call
      - command_execution
      - create_subagent_call
      - send_subagent_input_call
      - resume_subagent_call
      - wait_for_subagents_call
      - interrupt_subagent_call
      - close_subagent_call
      description: An output item produced by an agent.
    AgentToolResourceFunction:
      type: object
      properties:
        type:
          type: string
          enum:
          - function
          default: function
          x-stainless-const: true
          description: The type of the object. Always `function`.
        name:
          type: string
          minLength: 0
          description: The name of the function.
        description:
          type: string
          minLength: 0
          description: A description of what the function does.
        parameters:
          type: object
          additionalProperties: {}
          propertyNames:
            type: string
            minLength: 0
          minProperties: 0
          description: A JSON Schema object describing the function's arguments.
        defer_loading:
          type: boolean
          description: Whether the function is deferred and discovered through tool search.
