components:
  schemas:
    EnvironmentTypeResource:
      type: string
      enum:
      - openai_hosted
      - self_hosted
      description: The kind of execution environment.
    CreateAgentParams:
      type: object
      properties:
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 0
            maxLength: 512
          propertyNames:
            type: string
            minLength: 1
            maxLength: 64
          minProperties: 0
          maxProperties: 16
          description: Up to 16 string key-value pairs, with keys up to 64 and values up to 512 characters. Omission or null defaults to an empty map.
        name:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 128
          description: A human-readable name for the agent. Omission or null leaves the agent unnamed.
        model:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The model to use for the agent. The requested model name is preserved.
        reasoning:
          anyOf:
          - $ref: '#/components/schemas/ReasoningParam'
          - type: 'null'
          description: Configuration for model reasoning. Omission uses the model's default effort.
        text:
          anyOf:
          - $ref: '#/components/schemas/TextParam'
          - type: 'null'
          description: Configuration for generated text. Defaults to the `text` format and medium verbosity.
        service_tier:
          anyOf:
          - $ref: '#/components/schemas/ServiceTierParam'
          - type: 'null'
          description: The service tier used for model requests. Defaults to `auto`.
        instructions:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 1048576
          description: Additional instructions appended to the agent's default base instructions. Omit or set to null to add no custom instructions.
        tools:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PersistedAgentToolConfigParam'
          minItems: 0
          maxItems: 2000
          description: Tools available to the agent. Defaults to an empty list.
        multi_agent:
          anyOf:
          - $ref: '#/components/schemas/MultiAgentConfigCurrentParam'
          - type: 'null'
          description: Configuration for creating and coordinating subagents. Subagent tools are disabled by default.
      required:
      - model
      additionalProperties: false
      description: Parameters for creating a reusable agent.
    TurnObjectResource:
      type: string
      enum:
      - agent.session.turn
      default: agent.session.turn
      x-stainless-const: true
      description: The object type for a turn.
    MultiAgentConfigResource:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether subagent tools are enabled. Defaults to false.
        max_concurrent_subagents:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          maximum: 4294967295
          description: Maximum number of subagents that may run concurrently, or null when disabled. Defaults to 6 when enabled.
      required:
      - enabled
      - max_concurrent_subagents
      additionalProperties: false
      description: The resolved configuration for creating and coordinating subagents.
    CloseSubagentCallItemResource:
      type: object
      properties:
        type:
          type: string
          enum:
          - close_subagent_call
          default: close_subagent_call
          x-stainless-const: true
          x-enumDescriptions:
          - The current public item type.
          description: The item type. Always `close_subagent_call`.
        id:
          type: string
          minLength: 0
          description: The ID of the tool call item.
        turn_id:
          type: string
          minLength: 0
          description: The ID of the turn that contains this item.
        status:
          $ref: '#/components/schemas/FunctionCallStatusResource'
          description: The status of the tool call.
        sender_agent_id:
          type: string
          minLength: 0
          description: The ID of the agent requesting the close.
        recipient_agent_id:
          type: string
          minLength: 0
          description: The ID of the agent to close.
      required:
      - type
      - id
      - turn_id
      - status
      - sender_agent_id
      - recipient_agent_id
      additionalProperties: false
      description: A request to close a subagent.
    PersistedAgentToolConfigParamToolSearch:
      type: object
      properties:
        type:
          type: string
          enum:
          - tool_search
          default: tool_search
          x-stainless-const: true
          description: The type of the object. Always `tool_search`.
      required:
      - type
      additionalProperties: false
      description: Discovers deferred function tools and loads them into the model context.
    SessionEnvironmentStatusResource:
      type: string
      enum:
      - pending
      - ready
      - connected
      - disconnected
      - failed
      x-enumDescriptions:
      - The environment is being prepared.
      - The environment is ready to connect.
      - The environment is connected.
      - The environment is disconnected.
      - The environment failed to connect.
      description: The connection status of a session environment.
    InputContentResourceInputText:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_text
          default: input_text
          x-stainless-const: true
