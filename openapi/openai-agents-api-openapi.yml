          description: The ID of the agent to resume.
      required:
      - type
      - id
      - turn_id
      - status
      - sender_agent_id
      - recipient_agent_id
      additionalProperties: false
      description: A request to resume a subagent.
    MultiAgentConfigResource:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether subagent tools are enabled. Defaults to false.
        max_concurrent_subagents:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          maximum: 4294967295
          description: Maximum number of subagents that may run concurrently, or null when disabled. Defaults to 6 when enabled.
      required:
      - enabled
      - max_concurrent_subagents
      additionalProperties: false
      description: The resolved configuration for creating and coordinating subagents.
    SessionEventAgentSessionTurnCancelled:
      type: object
      properties:
        type:
          type: string
          enum:
          - agent.session.turn.cancelled
          default: agent.session.turn.cancelled
          x-stainless-const: true
          description: The type of the object. Always `agent.session.turn.cancelled`.
        event_id:
          type: string
          minLength: 0
          description: The unique ID of the event.
        session_id:
          type: string
          minLength: 0
          description: The ID of the session associated with the event.
        turn_id:
          type: string
          minLength: 0
          description: The ID of the turn associated with the event.
        turn:
          $ref: '#/components/schemas/TurnResource'
          description: The cancelled turn.
        usage:
          anyOf:
          - $ref: '#/components/schemas/TokenUsageResource'
          - type: 'null'
          description: Token usage by the root agent during the turn, when available.
      required:
      - type
      - event_id
      - session_id
      - turn_id
      - turn
      - usage
      additionalProperties: false
      description: Emitted when a turn is cancelled.
    ReasoningEffortParam:
      type: string
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
      - max
      description: The amount of reasoning effort the model should use.
    PersistedMcpTransportConfigParamStdio:
      type: object
      properties:
        type:
          type: string
          enum:
          - stdio
          default: stdio
          x-stainless-const: true
          description: The type of the object. Always `stdio`.
        command:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The command used to start the MCP server.
        args:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 0
            maxLength: 1048576
          minItems: 0
          maxItems: 16384
          description: Arguments passed to the MCP server command.
        cwd:
          type: string
          minLength: 0
          maxLength: 1048576
          description: The working directory used to start the MCP server.
        env_vars:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 0
            maxLength: 1048576
          minItems: 0
          maxItems: 16384
          description: Environment variable names to inherit from the selected execution environment.
      required:
      - type
      - command
      - cwd
      additionalProperties: false
      description: Starts an MCP server as a local process.
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
