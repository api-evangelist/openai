openapi: 3.2.0
info:
  title: OpenAI Decisions API
  description: The OpenAI REST API. Please see https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Decisions
paths:
  /decisions:
    post:
      operationId: createDecision
      summary: Create a decision
      description: 'Use this endpoint to ask classification or scoring questions about the same input. You’ll get the answers back in the order you asked the questions.


        For text, you can pass a string. You can also send user messages containing `input_text` and `input_image` parts, with up to 128 images per request. Images can be base64 data URLs or publicly accessible HTTP(S) URLs. File IDs aren’t accepted. Other message roles, function calls, files, audio, and item references aren’t supported.


        Sometimes a question returns a refusal instead of an answer. The result has type `refusal` and includes the question’s name, or `null` if you didn’t give it one.'
      tags:
      - Decisions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      responses:
        '200':
          description: The answers and token usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
      x-oaiMeta:
        group: decisions
        examples:
          request:
            curl: "curl https://api.openai.com/v1/decisions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -d '{\n    \"model\": \"gpt-6-luna\",\n    \"input\": \"The package arrived with a broken screen.\",\n    \"questions\": [\n      {\n        \"type\": \"predicate\",\n        \"name\": \"damaged\",\n        \"instructions\": \"Does the customer report a damaged item?\"\n      }\n    ]\n  }'\n"
          response: "{\n  \"model\": \"gpt-6-luna\",\n  \"answers\": [\n    {\"type\": \"predicate\", \"name\": \"damaged\", \"probability\": 0.95}\n  ],\n  \"usage\": {\n    \"input_tokens\": 42,\n    \"input_tokens_details\": {\"cached_tokens\": 0, \"cache_write_tokens\": 0},\n    \"output_tokens\": 0,\n    \"output_tokens_details\": {\"reasoning_tokens\": 0},\n    \"total_tokens\": 42\n  }\n}\n"
components:
  schemas:
    DecisionInput:
      oneOf:
      - type: string
        minLength: 0
        maxLength: 10485760
      - type: array
        items:
          oneOf:
          - $ref: '#/components/schemas/DecisionInputMessage'
          discriminator:
            propertyName: type
            mapping:
              message: '#/components/schemas/DecisionInputMessage'
          x-oai-discriminator-values:
          - message
          x-oai-default-discriminator-value: message
        minItems: 0
        maxItems: 131072
      description: The text or images to evaluate for every question. Provide a text string or user messages containing text and images. Images can be base64 data URLs or publicly accessible HTTP(S) URLs; at most 128 images are allowed across all messages in one request. Files, audio, tools, and item references are not supported.
    QuestionParamPredicate:
      type: object
      properties:
        type:
          type: string
          enum:
          - predicate
          default: predicate
          x-stainless-const: true
          description: The type of the object. Always `predicate`.
        name:
          type: string
          minLength: 0
          maxLength: 1048576
        instructions:
          type: string
          minLength: 0
          maxLength: 1048576
      required:
      - type
      - instructions
      additionalProperties: false
      description: Estimate how likely it is that a statement about the input is true.
    ChoiceValueResource:
      oneOf:
      - type: string
        minLength: 0
      - type: boolean
      description: 'Choice values are typed: a string and a boolean with the same text are distinct.'
    ChoiceOptionParam:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/ChoiceValueParam'
        description:
          type: string
          minLength: 0
          maxLength: 1048576
      required:
      - value
      additionalProperties: false
    AnswerResourceRefusal:
      type: object
      properties:
        type:
          type: string
          enum:
          - refusal
          default: refusal
          x-stainless-const: true
          description: The type of the object. Always `refusal`.
        name:
          type:
          - string
          - 'null'
          minLength: 0
      required:
      - type
      - name
      additionalProperties: false
      description: The model declined to answer this question. Other questions in the same request can still receive answers.
    DecisionInputMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - user
          default: user
          x-stainless-const: true
        content:
          $ref: '#/components/schemas/DecisionInputContent'
        type:
          type: string
          enum:
          - message
          default: message
          x-stainless-const: true
      required:
      - role
      - content
      additionalProperties: false
      description: A user message containing text or images.
    InputTokensDetailsResource:
      type: object
      properties:
        cached_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
        cache_write_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
      required:
      - cached_tokens
      - cache_write_tokens
      additionalProperties: false
    DecisionRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 0
          maxLength: 1048576
        input:
          $ref: '#/components/schemas/DecisionInput'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionParam'
          minItems: 1
          maxItems: 200
        safety_identifier:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 128
          description: Opaque caller-provided end-user identifier, scoped by the verified org. Match Responses' limit; this is never the authenticated user identity.
      required:
      - model
      - input
      - questions
      additionalProperties: false
    DecisionInputContent:
      oneOf:
      - type: string
        minLength: 0
        maxLength: 10485760
      - $ref: '#/components/schemas/DecisionInputContentParts'
        title: Parts
      description: Text evidence or an ordered list of text and image parts.
    DecisionInputImage:
      type: object
      properties:
        image_url:
          type: string
          minLength: 0
          maxLength: 1073741824
          pattern: ^(data:|https?://)
          description: A base64-encoded image in a data URL or a publicly accessible HTTP(S) image URL.
        detail:
          anyOf:
          - $ref: '#/components/schemas/ImageDetailParam'
          - type: 'null'
          description: The image detail level, using the selected model's image profile. Defaults to auto.
          default: auto
        type:
          type: string
          enum:
          - input_image
          default: input_image
          x-stainless-const: true
      required:
      - image_url
      - type
      additionalProperties: false
      description: An image provided as a base64 data URL or a publicly accessible HTTP(S) URL. File IDs are not supported.
    QuestionParamChoice:
      type: object
      properties:
        type:
          type: string
          enum:
          - choice
          default: choice
          x-stainless-const: true
          description: The type of the object. Always `choice`.
        name:
          type: string
          minLength: 0
          maxLength: 1048576
        instructions:
          type: string
          minLength: 0
          maxLength: 1048576
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOptionParam'
          minItems: 2
          maxItems: 255
          description: Provide between 2 and 255 choices. Each choice must be unique.
      required:
      - type
      - instructions
      - choices
      additionalProperties: false
      description: Choose from the supplied options based on the input.
    AnswerResourceChoice:
      type: object
      properties:
        type:
          type: string
          enum:
          - choice
          default: choice
          x-stainless-const: true
          description: The type of the object. Always `choice`.
        name:
          type:
          - string
          - 'null'
          minLength: 0
        choice:
          $ref: '#/components/schemas/ChoiceValueResource'
        probabilities:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceProbabilityResource'
          minItems: 0
          maxItems: 2000
        confidence:
          type: number
      required:
      - type
      - name
      - choice
      - probabilities
      - confidence
      additionalProperties: false
    QuestionParamScore:
      type: object
      properties:
        type:
          type: string
          enum:
          - score
          default: score
          x-stainless-const: true
          description: The type of the object. Always `score`.
        name:
          type: string
          minLength: 0
          maxLength: 1048576
        instructions:
          type: string
          minLength: 0
          maxLength: 1048576
        levels:
          type: array
          items:
            $ref: '#/components/schemas/ScoreLevelParam'
          minItems: 2
          maxItems: 10
      required:
      - type
      - instructions
      - levels
      additionalProperties: false
      description: Rate the input against the supplied ordered levels.
    DecisionInputText:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_text
          default: input_text
          x-stainless-const: true
        text:
          type: string
          minLength: 0
          maxLength: 10485760
      required:
      - type
      - text
      additionalProperties: false
    ResponseUsageResource:
      type: object
      properties:
        input_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
        input_tokens_details:
          $ref: '#/components/schemas/InputTokensDetailsResource'
        output_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
        output_tokens_details:
          $ref: '#/components/schemas/OutputTokensDetailsResource'
        total_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
      required:
      - input_tokens
      - input_tokens_details
      - output_tokens
      - output_tokens_details
      - total_tokens
      additionalProperties: false
    DecisionInputContentParts:
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/DecisionInputText'
        - $ref: '#/components/schemas/DecisionInputImage'
        discriminator:
          propertyName: type
          mapping:
            input_text: '#/components/schemas/DecisionInputText'
            input_image: '#/components/schemas/DecisionInputImage'
        x-oai-discriminator-values:
        - input_text
        - input_image
      minItems: 0
      maxItems: 16384
    QuestionParam:
      oneOf:
      - $ref: '#/components/schemas/QuestionParamPredicate'
      - $ref: '#/components/schemas/QuestionParamChoice'
      - $ref: '#/components/schemas/QuestionParamScore'
      discriminator:
        propertyName: type
        mapping:
          predicate: '#/components/schemas/QuestionParamPredicate'
          choice: '#/components/schemas/QuestionParamChoice'
          score: '#/components/schemas/QuestionParamScore'
      x-oai-discriminator-values:
      - predicate
      - choice
      - score
      description: A question about the request's input, with an optional correlation name.
    AnswerResourcePredicate:
      type: object
      properties:
        type:
          type: string
          enum:
          - predicate
          default: predicate
          x-stainless-const: true
          description: The type of the object. Always `predicate`.
        name:
          type:
          - string
          - 'null'
          minLength: 0
        probability:
          type: number
      required:
      - type
      - name
      - probability
      additionalProperties: false
    DecisionResponse:
      type: object
      properties:
        model:
          type: string
          minLength: 0
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerResource'
          minItems: 0
          maxItems: 2000
        usage:
          $ref: '#/components/schemas/ResponseUsageResource'
      required:
      - model
      - answers
      - usage
      additionalProperties: false
    ScoreLevelParam:
      type: object
      properties:
        label:
          type: string
          minLength: 0
          maxLength: 1048576
        description:
          type: string
          minLength: 0
          maxLength: 1048576
      required:
      - label
      additionalProperties: false
    ImageDetailParam:
      type: string
      enum:
      - low
      - high
      - auto
      - original
    AnswerResourceScore:
      type: object
      properties:
        type:
          type: string
          enum:
          - score
          default: score
          x-stainless-const: true
          description: The type of the object. Always `score`.
        name:
          type:
          - string
          - 'null'
          minLength: 0
        score:
          type: number
        probabilities:
          type: array
          items:
            $ref: '#/components/schemas/ScoreProbabilityResource'
          minItems: 0
          maxItems: 2000
        confidence:
          type: number
      required:
      - type
      - name
      - score
      - probabilities
      - confidence
      additionalProperties: false
    ChoiceProbabilityResource:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/ChoiceValueResource'
        probability:
          type: number
      required:
      - value
      - probability
      additionalProperties: false
    ScoreProbabilityResource:
      type: object
      properties:
        value:
          type: integer
          format: int64
        label:
          type: string
          minLength: 0
        probability:
          type: number
      required:
      - value
      - label
      - probability
      additionalProperties: false
    ChoiceValueParam:
      oneOf:
      - type: string
        minLength: 0
        maxLength: 1048576
      - type: boolean
      description: 'Choice values are typed: a string and a boolean with the same text are distinct.'
    AnswerResource:
      oneOf:
      - $ref: '#/components/schemas/AnswerResourcePredicate'
      - $ref: '#/components/schemas/AnswerResourceChoice'
      - $ref: '#/components/schemas/AnswerResourceScore'
      - $ref: '#/components/schemas/AnswerResourceRefusal'
      discriminator:
        propertyName: type
        mapping:
          predicate: '#/components/schemas/AnswerResourcePredicate'
          choice: '#/components/schemas/AnswerResourceChoice'
          score: '#/components/schemas/AnswerResourceScore'
          refusal: '#/components/schemas/AnswerResourceRefusal'
      x-oai-discriminator-values:
      - predicate
      - choice
      - score
      - refusal
      description: A completed question always includes its name, including null when unnamed.
    OutputTokensDetailsResource:
      type: object
      properties:
        reasoning_tokens:
          type: integer
          format: int64
          minimum: -2147483648
          maximum: 2147483647
      required:
      - reasoning_tokens
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
