openapi: 3.2.0
info:
  title: Openai Project groups API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Project groups across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Project Groups
paths:
  /organization/projects/{project_id}/groups:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: List project groups
      description: Lists the groups that have access to a project.
      operationId: list-project-groups
      tags:
      - Project Groups
      parameters:
      - name: project_id
        in: path
        description: The ID of the project to inspect.
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: A limit on the number of project groups to return. Defaults to 20.
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 20
      - name: after
        in: query
        description: Cursor for pagination. Provide the ID of the last group from the previous response to fetch the next page.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: Sort order for the returned groups.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Project groups listed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupListResource'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/projects/proj_abc123/groups?limit=20 \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"list\",\n    \"data\": [\n        {\n            \"object\": \"project.group\",\n            \"project_id\": \"proj_abc123\",\n            \"group_id\": \"group_01J1F8ABCDXYZ\",\n            \"group_name\": \"Support Team\",\n            \"created_at\": 1711471533\n        }\n    ],\n    \"has_more\": false,\n    \"next\": null\n}\n"
    post:
      security:
      - AdminApiKeyAuth: []
      summary: Add project group
      description: Grants a group access to a project.
      operationId: add-project-group
      tags:
      - Project Groups
      parameters:
      - name: project_id
        in: path
        description: The ID of the project to update.
        required: true
        schema:
          type: string
      requestBody:
        description: Identifies the group and role to assign to the project.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteProjectGroupBody'
      responses:
        '200':
          description: Group granted access to the project successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X POST https://api.openai.com/v1/organization/projects/proj_abc123/groups \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n      \"group_id\": \"group_01J1F8ABCDXYZ\",\n      \"role\": \"role_01J1F8PROJ\"\n  }'\n"
          response: "{\n    \"object\": \"project.group\",\n    \"project_id\": \"proj_abc123\",\n    \"group_id\": \"group_01J1F8ABCDXYZ\",\n    \"group_name\": \"Support Team\",\n    \"created_at\": 1711471533\n}\n"
    servers:
    - url: https://api.openai.com/v1
  /organization/projects/{project_id}/groups/{group_id}:
    get:
      security:
      - AdminApiKeyAuth: []
      summary: Retrieve project group
      description: Retrieves a project's group.
      operationId: retrieve-project-group
      tags:
      - Project Groups
      parameters:
      - name: project_id
        in: path
        description: The ID of the project to inspect.
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        description: The ID of the group to retrieve.
        required: true
        schema:
          type: string
      - name: group_type
        in: query
        description: The type of group to retrieve.
        required: false
        schema:
          type: string
          enum:
          - group
          - tenant_group
          default: group
      responses:
        '200':
          description: Project group retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroup'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl https://api.openai.com/v1/organization/projects/proj_abc123/groups/group_01J1F8ABCDXYZ \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"project.group\",\n    \"project_id\": \"proj_abc123\",\n    \"group_id\": \"group_01J1F8ABCDXYZ\",\n    \"group_name\": \"Support Team\",\n    \"group_type\": \"group\",\n    \"created_at\": 1711471533\n}\n"
    delete:
      security:
      - AdminApiKeyAuth: []
      summary: Remove project group
      description: Revokes a group's access to a project.
      operationId: remove-project-group
      tags:
      - Project Groups
      parameters:
      - name: project_id
        in: path
        description: The ID of the project to update.
        required: true
        schema:
          type: string
      - name: group_id
        in: path
        description: The ID of the group to remove from the project.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Group removed from the project successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupDeletedResource'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-oaiMeta:
        group: administration
        examples:
          request:
            curl: "curl -X DELETE https://api.openai.com/v1/organization/projects/proj_abc123/groups/group_01J1F8ABCDXYZ \\\n  -H \"Authorization: Bearer $OPENAI_ADMIN_KEY\" \\\n  -H \"Content-Type: application/json\"\n"
          response: "{\n    \"object\": \"project.group.deleted\",\n    \"deleted\": true\n}\n"
    servers:
    - url: https://api.openai.com/v1
components:
  responses:
    TooManyRequests:
      description: The request was rejected because a rate limit was exceeded.
      headers:
        Retry-After:
          description: The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    _MisalignmentErrorType:
      anyOf:
      - type: string
      - type: string
        enum:
        - potentially_unintended_data_transfer
        - potentially_unintended_data_access
        - potentially_unintended_destructive_activity
        - other
    Error:
      type: object
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
        message:
          type: string
        param:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        misalignment:
          $ref: '#/components/schemas/MisalignmentErrorDetailsResource'
      required:
      - type
      - message
      - param
      - code
    MisalignmentErrorDetailsResource:
      properties:
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
    ProjectGroupListResource:
      type: object
      description: Paginated list of groups that have access to a project.
      properties:
        object:
          type: string
          enum:
          - list
          description: Always `list`.
          x-stainless-const: true
        data:
          type: array
          description: Project group memberships returned in the current page.
          items:
            $ref: '#/components/schemas/ProjectGroup'
        has_more:
          type: boolean
          description: Whether additional project group memberships are available.
        next:
          description: Cursor to fetch the next page of results, or `null` when there are no more results.
          anyOf:
          - type: string
          - type: 'null'
      required:
      - object
      - data
      - has_more
      - next
      x-oaiMeta:
        name: Project group list
        example: "{\n    \"object\": \"list\",\n    \"data\": [\n        {\n            \"object\": \"project.group\",\n            \"project_id\": \"proj_abc123\",\n            \"group_id\": \"group_01J1F8ABCDXYZ\",\n            \"group_name\": \"Support Team\",\n            \"created_at\": 1711471533\n        }\n    ],\n    \"has_more\": false,\n    \"next\": null\n}\n"
    InviteProjectGroupBody:
      type: object
      description: Request payload for granting a group access to a project.
      properties:
        group_id:
          type: string
          description: Identifier of the group to add to the project.
        role:
          type: string
          description: Identifier of the project role to grant to the group.
      required:
      - group_id
      - role
      x-oaiMeta:
        example: "{\n    \"group_id\": \"group_01J1F8ABCDXYZ\",\n    \"role\": \"role_01J1F8PROJ\"\n}\n"
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
      - message
    ProjectGroupDeletedResource:
      type: object
      description: Confirmation payload returned after removing a group from a project.
      properties:
        object:
          type: string
          enum:
          - project.group.deleted
          description: Always `project.group.deleted`.
          x-stainless-const: true
        deleted:
          type: boolean
          description: Whether the group membership in the project was removed.
      required:
      - object
      - deleted
      x-oaiMeta:
        name: Project group deletion confirmation
        example: "{\n    \"object\": \"project.group.deleted\",\n    \"deleted\": true\n}\n"
    ProjectGroup:
      type: object
      description: Details about a group's membership in a project.
      properties:
        object:
          type: string
          enum:
          - project.group
          description: Always `project.group`.
          x-stainless-const: true
        project_id:
          type: string
          description: Identifier of the project.
        group_id:
          type: string
          description: Identifier of the group that has access to the project.
        group_name:
          type: string
          description: Display name of the group.
        group_type:
          type: string
          enum:
          - group
          - tenant_group
          description: The type of the group.
        created_at:
          type: integer
          format: unixtime
          description: Unix timestamp (in seconds) when the group was granted project access.
      required:
      - object
      - project_id
      - group_id
      - group_name
      - group_type
      - created_at
      x-oaiMeta:
        name: The project group object
        example: "{\n    \"object\": \"project.group\",\n    \"project_id\": \"proj_abc123\",\n    \"group_id\": \"group_01J1F8ABCDXYZ\",\n    \"group_name\": \"Support Team\",\n    \"group_type\": \"group\",\n    \"created_at\": 1711471533\n}\n"
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    MisalignmentErrorDetailsResource_2:
      properties:
        review_target:
          anyOf:
          - not:
              pattern: '[^A-Za-z0-9._~:-]'
            type: string
            maxLength: 96
            minLength: 1
            pattern: ^[A-Za-z0-9._~:-]+$
            description: An opaque target for explicitly continuing this review, or null when unavailable.
          - type: 'null'
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
    PermissionErrorResponse:
      type: object
      properties:
        error:
          description: Details about the permission error.
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: string
            description: An explanation of the missing API permissions.
      required:
      - error
    ProjectGroupListResource_2:
      type: object
      description: Paginated list of groups that have access to a project.
      properties:
        object:
          type: string
          enum:
          - list
          description: Always `list`.
          x-stainless-const: true
        data:
          type: array
          description: Project group memberships returned in the current page.
          items:
            $ref: '#/components/schemas/ProjectGroup'
        has_more:
          type: boolean
          description: Whether additional project group memberships are available.
        next:
          description: Cursor to fetch the next page of results, or `null` when there are no more results.
          anyOf:
          - type: string
          - type: 'null'
      required:
      - object
      - data
      - has_more
      - next
      x-oaiMeta:
        name: Project group list
        example: "{\n    \"object\": \"list\",\n    \"data\": [\n        {\n            \"object\": \"project.group\",\n            \"project_id\": \"proj_abc123\",\n            \"group_id\": \"group_01J1F8ABCDXYZ\",\n            \"group_name\": \"Support Team\",\n            \"group_type\": \"group\",\n            \"created_at\": 1711471533\n        }\n    ],\n    \"has_more\": false,\n    \"next\": null\n}\n"
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
      type: http
      scheme: bearer
