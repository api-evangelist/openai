components:
  schemas:
    OrganizationSpendAlert:
      type: object
      description: Represents a spend alert configured at the organization level.
      properties:
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints.
        object:
          type: string
          enum:
          - organization.spend_alert
          description: The object type, which is always `organization.spend_alert`.
          x-stainless-const: true
        threshold_amount:
          type: integer
          description: The alert threshold amount, in cents.
        currency:
          type: string
          enum:
          - USD
          description: The currency for the threshold amount.
        interval:
          type: string
          enum:
          - month
          description: The time interval for evaluating spend against the threshold.
        notification_channel:
          $ref: '#/components/schemas/SpendAlertNotificationChannel'
      required:
      - id
      - object
      - threshold_amount
      - currency
      - interval
      - notification_channel
      x-oaiMeta:
        name: The organization spend alert object
        example: "{\n    \"id\": \"alert_abc123\",\n    \"object\": \"organization.spend_alert\",\n    \"threshold_amount\": 100000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"notification_channel\": {\n        \"type\": \"email\",\n        \"recipients\": [\"finance@example.com\"],\n        \"subject_prefix\": \"OpenAI spend alert\"\n    }\n}\n"
    ProjectSpendAlertDeletedResource:
      type: object
      description: Confirmation payload returned after deleting a project spend alert.
      properties:
        id:
          type: string
          description: The deleted spend alert ID.
        object:
          type: string
          enum:
          - project.spend_alert.deleted
          description: Always `project.spend_alert.deleted`.
          x-stainless-const: true
        deleted:
          type: boolean
          description: Whether the spend alert was deleted.
      required:
      - id
      - object
      - deleted
    OrganizationSpendAlertListResource:
      type: object
      description: Paginated list of organization spend alerts.
      properties:
        object:
          type: string
          enum:
          - list
          description: Always `list`.
          x-stainless-const: true
        data:
          type: array
          description: Spend alerts returned in the current page.
          items:
            $ref: '#/components/schemas/OrganizationSpendAlert'
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the first spend alert in this page.
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the last spend alert in this page.
        has_more:
          type: boolean
          description: Whether more spend alerts are available when paginating.
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    SpendAlertNotificationChannel:
      type: object
      description: Email notification settings for a spend alert.
      properties:
        type:
          type: string
          enum:
          - email
          description: The notification channel type. Currently only `email` is supported.
          x-stainless-const: true
        recipients:
          type: array
          description: Email addresses that receive the spend alert notification.
          items:
            type: string
        subject_prefix:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional subject prefix for alert emails.
      required:
      - type
      - recipients
    CreateSpendAlertBody:
      type: object
      description: Parameters for creating or updating a spend alert.
      properties:
        threshold_amount:
          type: integer
          minimum: 0
          description: The alert threshold amount, in cents.
        currency:
          type: string
          enum:
          - USD
          description: The currency for the threshold amount.
        interval:
          type: string
          enum:
          - month
          description: The time interval for evaluating spend against the threshold.
        notification_channel:
          $ref: '#/components/schemas/SpendAlertNotificationChannel'
      required:
      - threshold_amount
      - currency
      - interval
      - notification_channel
    ProjectSpendAlertListResource:
      type: object
      description: Paginated list of project spend alerts.
      properties:
        object:
          type: string
          enum:
          - list
          description: Always `list`.
          x-stainless-const: true
        data:
          type: array
          description: Spend alerts returned in the current page.
          items:
            $ref: '#/components/schemas/ProjectSpendAlert'
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the first spend alert in this page.
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The ID of the last spend alert in this page.
        has_more:
          type: boolean
          description: Whether more spend alerts are available when paginating.
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    OrganizationSpendAlertDeletedResource:
      type: object
      description: Confirmation payload returned after deleting an organization spend alert.
      properties:
        id:
          type: string
          description: The deleted spend alert ID.
        object:
          type: string
          enum:
          - organization.spend_alert.deleted
          description: Always `organization.spend_alert.deleted`.
          x-stainless-const: true
        deleted:
          type: boolean
          description: Whether the spend alert was deleted.
      required:
      - id
      - object
      - deleted
    ProjectSpendAlert:
      type: object
      description: Represents a spend alert configured at the project level.
      properties:
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints.
        object:
          type: string
          enum:
          - project.spend_alert
          description: The object type, which is always `project.spend_alert`.
          x-stainless-const: true
        threshold_amount:
          type: integer
          description: The alert threshold amount, in cents.
        currency:
          type: string
          enum:
          - USD
          description: The currency for the threshold amount.
        interval:
          type: string
          enum:
          - month
          description: The time interval for evaluating spend against the threshold.
        notification_channel:
          $ref: '#/components/schemas/SpendAlertNotificationChannel'
      required:
      - id
      - object
      - threshold_amount
      - currency
      - interval
      - notification_channel
      x-oaiMeta:
        name: The project spend alert object
        example: "{\n    \"id\": \"alert_abc123\",\n    \"object\": \"project.spend_alert\",\n    \"threshold_amount\": 100000,\n    \"currency\": \"USD\",\n    \"interval\": \"month\",\n    \"notification_channel\": {\n        \"type\": \"email\",\n        \"recipients\": [\"finance@example.com\"],\n        \"subject_prefix\": \"OpenAI spend alert\"\n    }\n}\n"
    _MisalignmentErrorType:
      anyOf:
      - type: string
      - type: string
        enum:
        - potentially_unintended_data_transfer
        - potentially_unintended_data_access
        - potentially_unintended_destructive_activity
        - other
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    Error:
      type: object
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
        message:
          type: string
        param:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        misalignment:
          $ref: '#/components/schemas/MisalignmentErrorDetailsResource'
      required:
      - type
      - message
      - param
      - code
    MisalignmentErrorDetailsResource:
      properties:
        review_target:
          anyOf:
          - not:
              pattern: '[^A-Za-z0-9._~:-]'
            type: string
            maxLength: 96
            minLength: 1
            pattern: ^[A-Za-z0-9._~:-]+$
            description: An opaque target for explicitly continuing this review, or null when unavailable.
          - type: 'null'
        error_type:
          $ref: '#/components/schemas/_MisalignmentErrorType'
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: '#/components/schemas/_MisalignmentSteer'
          description: An optional public continuation instruction.
      type: object
      required: []
    PermissionErrorResponse:
      type: object
      properties:
        error:
          description: Details about the permission error.
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: string
            description: An explanation of the missing API permissions.
      required:
      - error
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
      - message
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
    AdminApiKeyAuth:
