openapi: 3.2.0
info:
  title: Openai Live API
  version: 2.3.0
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://openai.com/policies/terms-of-use
  description: 'Operations tagged Live across 2 of this provider''s published API definitions: openai-openapi-master-2026-09-23.yml, openai-openapi-master-2026-10-12.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.openai.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Live
paths:
  /live/sessions:
    post:
      operationId: create-live
      summary: Create session
      description: Create a Live WebRTC session. Start with the Live prompting guide.
      tags:
      - Live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveCreateRequest'
      responses:
        '201':
          description: Live session created with a WebRTC answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCreateResponse'
              example:
                session:
                  id: live_123
                transport:
                  type: webrtc
                  sdp: <SDP answer>
      x-oaiMeta:
        group: live
        returns: Returns 201 Created with the session identifier in session.id and SDP answer in transport.sdp.
        examples:
          request:
            curl: "curl https://api.openai.com/v1/live/sessions \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"session\":{\"model\":\"gpt-live-1\",\"instructions\":\"Be concise. Ask for clarification when needed.\"},\"transport\":{\"type\":\"webrtc\",\"sdp\":\"<SDP offer>\"}}'"
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/accept:
    post:
      operationId: accept-live-session
      summary: Accept call
      description: Accept an incoming SIP call. Supply session with type live, the model, and startup configuration. Before accepting calls, follow the Live prompting guide to write frontend conversation instructions and a separate backend prompt. SIP media format is negotiated; omit audio.format.
      tags:
      - Live
      parameters:
      - in: path
        name: session_id
        required: true
        description: Opaque Live session identifier from the creation response or incoming-call webhook. Preserve the returned value unchanged, including its prefix.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveCallAcceptRequest'
      responses:
        '200':
          description: Session accept request accepted.
      x-oaiMeta:
        group: live-sessions
        returns: Returns 200 OK when the control request succeeds.
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/fork:
    post:
      operationId: fork-live-session
      summary: Fork session
      description: Fork a stored Live session onto a new WebRTC connection.
      tags:
      - Live
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
        description: The ID of the stored Live session to fork.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveForkRequest'
      responses:
        '201':
          description: Forked Live session created with a WebRTC answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveCreateResponse'
      x-oaiMeta:
        group: live
        returns: The new session identifier in session.id and SDP answer in transport.sdp.
        examples:
          request:
            curl: "curl https://api.openai.com/v1/live/sessions/live_123/fork \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"session\":{},\"transport\":{\"type\":\"webrtc\",\"sdp\":\"<SDP offer>\"}}'"
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/hangup:
    post:
      operationId: hangup-live-session
      summary: Hang up session
      description: End a SIP call identified by session_id.
      tags:
      - Live
      parameters:
      - in: path
        name: session_id
        required: true
        description: Opaque Live session identifier from the creation response or incoming-call webhook. Preserve the returned value unchanged, including its prefix.
        schema:
          type: string
      responses:
        '200':
          description: Session hangup request accepted.
      x-oaiMeta:
        group: live-sessions
        returns: Returns 200 OK when the control request succeeds.
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/refer:
    post:
      operationId: refer-live-session
      summary: Transfer call
      description: Transfer a SIP call to another destination. Supply a nonblank target_uri for the SIP Refer-To header.
      tags:
      - Live
      parameters:
      - in: path
        name: session_id
        required: true
        description: Opaque Live session identifier from the creation response or incoming-call webhook. Preserve the returned value unchanged, including its prefix.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveCallReferRequest'
      responses:
        '200':
          description: Session refer request accepted.
      x-oaiMeta:
        group: live-sessions
        returns: Returns 200 OK when the control request succeeds.
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/reject:
    post:
      operationId: reject-live-session
      summary: Reject call
      description: Reject an incoming SIP call. Send a required SIP rejection status_code between 300 and 699.
      tags:
      - Live
      parameters:
      - in: path
        name: session_id
        required: true
        description: Opaque Live session identifier from the creation response or incoming-call webhook. Preserve the returned value unchanged, including its prefix.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveCallRejectRequest'
      responses:
        '200':
          description: Session reject request accepted.
      x-oaiMeta:
        group: live-sessions
        returns: Returns 200 OK when the control request succeeds.
    servers:
    - url: https://api.openai.com/v1
  /live/sessions/{session_id}/content:
    get:
      tags:
      - Live
      summary: Download recording
      description: Get Live session content
      operationId: download-live-recording
      parameters:
      - name: session_id
        in: path
        description: The ID of the stored Live session to download. Use the session ID returned when the session started with storage enabled.
        required: true
        schema:
          description: The ID of the stored Live session to download. Use the session ID returned when the session started with storage enabled.
          type: string
          pattern: ^live_[A-Za-z0-9_-]{1,128}$
      responses:
        '200':
          description: Stored session recording. Input audio is in the left channel and output audio is in the right channel.
          content:
            audio/wav:
              schema:
                description: The Live session recording as a stereo WAV file, with input audio in the left channel and output audio in the right channel.
                type: string
                format: binary
      x-oaiMeta:
        group: live
        returns: The stored session recording as binary stereo WAV audio.
    servers:
    - url: https://api.openai.com/v1
components:
  schemas:
    LiveResponsesDelegationParam:
      description: Delegate tasks to a Responses model managed by the Live session.
      type: object
      properties:
        type:
          description: The delegation owner. Always `responses` for tasks handled by the Responses API.
          default: responses
          x-stainless-const: true
          type: string
          enum:
          - responses
        responses:
          description: Backend model, prompt, and tools used when the Live session delegates a task to Responses.
          $ref: '#/components/schemas/LiveResponsesDelegationSettingsInputParam'
      required:
      - type
      - responses
    LiveClientConfigParam:
      description: Startup-only capabilities for an untrusted frontend attached to a unified WebRTC session. Trusted sideband connections are unaffected.
      type: object
      properties:
        data_channel:
          description: Client and server event permissions for the WebRTC frontend data channel.
          $ref: '#/components/schemas/LiveDataChannelConfigParam'
      required:
      - data_channel
    LiveInitialAssistantMessageItemParam:
      description: An assistant message included in the initial text history of a Live session.
      type: object
      properties:
        id:
          anyOf:
          - description: An optional identifier for the supplied history message. Live uses the message’s role and text to initialize the conversation.
            type: string
          - type: 'null'
        type:
          description: The history item type. Always `message`.
          default: message
          x-stainless-const: true
          type: string
          enum:
          - message
        status:
          anyOf:
          - description: The supplied message’s status. Live uses its text as history and does not resume an incomplete message.
            $ref: '#/components/schemas/LiveInitialMessageStatus'
          - type: 'null'
        role:
          description: The author of this history message. Always `assistant`.
          default: assistant
          x-stainless-const: true
          type: string
          enum:
          - assistant
        content:
          description: The message content. Supply exactly one text part for the initial Live conversation history.
          type: array
          items:
            discriminator:
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/LiveInitialTextContentPartParam'
            - $ref: '#/components/schemas/LiveInitialOutputTextContentPartParam'
            x-oai-default-discriminator-value: text
          minItems: 1
          maxItems: 1
      required:
      - role
      - content
    LiveDataChannelConfigParam:
      description: Control which Live events an untrusted WebRTC frontend can send and receive over its data channel. These restrictions do not apply to trusted sideband connections.
      type: object
      properties:
        allowed_client_events:
          description: Client event types that the frontend data channel may send. Use 'all' to allow every client event; an empty array allows none. Omission preserves the existing allow-all behavior.
          oneOf:
          - default: all
            x-stainless-const: true
            type: string
            enum:
            - all
          - type: array
            items:
              description: A Live client event type allowed on the frontend data channel, such as `session.input_audio.mute`.
              type: string
              minLength: 1
              maxLength: 256
              pattern: ^(?:error|info|[a-z][a-z0-9_-]*(?:\.[a-z0-9_-]+)+)$
            maxItems: 256
        allowed_server_events:
          description: Server events that may be sent to the frontend data channel. Use 'all' to allow every server event; an empty array allows none. Omission preserves the existing allow-all behavior. Responses events use an object with type 'response.event' and a response_event selector.
          oneOf:
          - default: all
            x-stainless-const: true
            type: string
            enum:
            - all
          - type: array
            items:
              $ref: '#/components/schemas/LiveAllowedServerEventParam'
            maxItems: 256
      required: []
    LiveResponsesDelegationSettingsUpdateInputParam:
      description: Updates to the Responses backend of an existing Live session. Omitted settings retain their current values.
      type: object
      properties:
        model:
          description: The Responses backend model to use for subsequent delegated requests. Omit to keep the current backend model.
          type: string
        instructions:
          anyOf:
          - description: Instructions for the delegated Responses model, separate from Live instructions. See [backend prompting](https://developers.openai.com/api/docs/guides/live-delegation#start-with-your-existing-backend-prompt).
            type: string
          - type: 'null'
        max_output_tokens:
          anyOf:
          - description: Maximum number of output tokens for each delegated response.
            type: integer
            minimum: 16
          - type: 'null'
        service_tier:
          anyOf:
          - description: Service tier for delegated Responses requests.
            $ref: '#/components/schemas/LiveResponsesServiceTier'
          - type: 'null'
        reasoning:
          anyOf:
          - description: Reasoning settings passed to each delegated Responses request.
            $ref: '#/components/schemas/LiveDelegationReasoningInputParam'
          - type: 'null'
        text:
          anyOf:
          - description: Text generation settings passed to each delegated Responses request.
            $ref: '#/components/schemas/LiveDelegationTextInputParam'
          - type: 'null'
        tools:
          description: Tools available to the Responses backend while it handles tasks delegated by the Live model.
          type: array
          items:
            discriminator:
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/LiveFunctionToolInputParam'
            - $ref: '#/components/schemas/LiveWebSearchToolInputParam'
        tool_choice:
          description: Controls which tool the Responses backend uses when handling a task delegated by the Live model.
          oneOf:
          - $ref: '#/components/schemas/LiveToolChoiceEnum'
          - $ref: '#/components/schemas/LiveFunctionToolChoiceParam'
          - $ref: '#/components/schemas/LiveMCPToolChoiceParam'
        parallel_tool_calls:
          anyOf:
          - description: Whether the delegated Responses model may request multiple tool calls in a single response.
            type: boolean
          - type: 'null'
      required: []
    LiveMediaSessionForkParams:
      type: object
      description: Optional overrides for a stored Live session. Omitted settings are inherited. The model, voice, frontend instructions, and prior conversation come from the stored session. WebRTC negotiates its audio format; audio.format is only supported on WebSocket forks.
      properties:
        store:
          $ref: '#/components/schemas/properties-store'
        delegation:
          $ref: '#/components/schemas/LiveResponsesDelegationUpdateParam'
        client:
          $ref: '#/components/schemas/LiveClientConfigParam'
      additionalProperties: false
    LiveInitialItem:
      description: A developer, user, or assistant message supplied as text history before the Live session starts.
      discriminator:
        propertyName: role
      oneOf:
      - $ref: '#/components/schemas/LiveInitialDeveloperMessageItemParam'
      - $ref: '#/components/schemas/LiveInitialUserMessageItemParam'
      - $ref: '#/components/schemas/LiveInitialAssistantMessageItemParam'
    LiveResponsesServiceTier:
      type: string
      enum:
      - auto
      - default
      - fast_tier_temp_pilot
      - flex
      - priority
      - ultrafast
    LiveInitialMessageStatus:
      type: string
      enum:
      - incomplete
      - completed
    LiveCreateResponse:
      type: object
      description: The created Live session identifier and WebRTC answer. Apply transport.sdp as the peer's remote answer and wait for session.started on the data channel before sending commands.
      properties:
        session:
          type: object
          description: The newly created Live session. Use its ID for session controls and sideband connections.
          properties:
            id:
              type: string
              description: Opaque session identifier. Preserve the returned value unchanged, including its prefix.
          required:
          - id
        transport:
          $ref: '#/components/schemas/LiveWebRTCTransport'
          description: WebRTC transport with the SDP answer.
      required:
      - session
      - transport
    LiveInitialInputTextContentPartParam:
      description: Text supplied in a developer or user message when starting a Live session.
      type: object
      properties:
        type:
          description: The text content type. Always `input_text`.
          default: input_text
          x-stainless-const: true
          type: string
          enum:
          - input_text
        text:
          description: The message text to include in the Live session’s initial conversation history.
          type: string
      required:
      - text
    LiveInitialUserMessageItemParam:
      description: A user message included in the initial text history of a Live session.
      type: object
      properties:
        id:
          anyOf:
          - description: An optional identifier for the supplied history message. Live uses the message’s role and text to initialize the conversation.
            type: string
          - type: 'null'
        type:
          description: The history item type. Always `message`.
          default: message
          x-stainless-const: true
          type: string
          enum:
          - message
        status:
          anyOf:
          - description: The supplied message’s status. Live uses its text as history and does not resume an incomplete message.
            $ref: '#/components/schemas/LiveInitialMessageStatus'
          - type: 'null'
        role:
          description: The author of this history message. Always `user`.
          default: user
          x-stainless-const: true
          type: string
          enum:
          - user
        content:
          description: The message content. Supply exactly one text part for the initial Live conversation history.
          type: array
          items:
            $ref: '#/components/schemas/LiveInitialInputTextContentPartParam'
          minItems: 1
          maxItems: 1
      required:
      - role
      - content
    ModelIdsLive:
      description: The Live model. Required in the session configuration for every transport; do not pass it as a URL query parameter.
      example: gpt-live-1
      anyOf:
      - type: string
        minLength: 1
      - type: string
        enum:
        - gpt-live-1
    LiveCallAcceptSession:
      type: object
      description: Startup configuration for accepting an incoming Live SIP call. Follow the [Live prompting guide](https://developers.openai.com/api/docs/guides/live-prompting) when writing frontend and backend instructions.
      properties:
        model:
          $ref: '#/components/schemas/ModelIdsLive'
          description: The Live model to use for the accepted call.
          minLength: 1
        instructions:
          $ref: '#/components/schemas/instructions'
        audio:
          $ref: '#/components/schemas/LiveMediaSessionAudioParam'
          description: Startup audio output configuration. SIP negotiates the media format; audio.format is only accepted for primary WebSockets. Voice cannot change after startup.
        delegation:
          $ref: '#/components/schemas/delegation'
        store:
          $ref: '#/components/schemas/store'
        input:
          $ref: '#/components/schemas/input'
        type:
          type: string
          enum:
          - live
          default: live
          x-stainless-const: true
          description: The session type. Always `live`.
      required:
      - model
      - type
      additionalProperties: false
    LiveInitialDeveloperMessageItemParam:
      description: A developer message included in the initial text history of a Live session.
      type: object
      properties:
        id:
          anyOf:
          - description: An optional identifier for the supplied history message. Live uses the message’s role and text to initialize the conversation.
            type: string
          - type: 'null'
        type:
          description: The history item type. Always `message`.
          default: message
          x-stainless-const: true
          type: string
          enum:
          - message
        status:
          anyOf:
          - description: The supplied message’s status. Live uses its text as history and does not resume an incomplete message.
            $ref: '#/components/schemas/LiveInitialMessageStatus'
          - type: 'null'
        role:
          description: The author of this history message. Always `developer`.
          default: developer
          x-stainless-const: true
          type: string
          enum:
          - developer
        content:
          description: The message content. Supply exactly one text part for the initial Live conversation history.
          type: array
          items:
            $ref: '#/components/schemas/LiveInitialInputTextContentPartParam'
          minItems: 1
          maxItems: 1
      required:
      - role
      - content
    LiveReasoningEffort:
      type: string
      enum:
      - none
      - minimal
      - low
      - medium
      - high
      - xhigh
    input:
      description: Ordered text-only history supplied before startup. Supports developer, user, and assistant messages with one text part each; at most 128 messages and 8,192 rendered tokens in total.
      type: array
      items:
        $ref: '#/components/schemas/LiveInitialItem'
      maxItems: 128
    properties-store:
      description: Whether to store the forked session. Omission inherits the stored session's setting.
      type: boolean
    LiveResponsesDelegationUpdateParam:
      description: Update the Responses backend for an existing Live session without changing delegation ownership.
      type: object
      properties:
        type:
          description: The delegation owner. Always `responses` for tasks handled by the Responses API.
          default: responses
          x-stainless-const: true
          type: string
          enum:
          - responses
        responses:
          description: Responses backend settings to update. Omitted settings keep their existing values.
          $ref: '#/components/schemas/LiveResponsesDelegationSettingsUpdateInputParam'
      required:
      - type
    LiveCustomVoiceParam:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - id
    LiveAllowedServerEventParam:
      description: A Live server event selector for the WebRTC frontend data channel.
      example:
        type: session.started
      type: object
      properties:
        type:
          description: The outer Live server event type. Use 'response.event' for Responses events.
          type: string
          minLength: 1
          maxLength: 256
        response_event:
          description: The nested Responses event type. Required when type is 'response.event'; forbidden for other event types.
          type: string
          minLength: 1
          maxLength: 256
      required:
      - type
      additionalProperties: false
      x-oaiMeta:
        example:
          type: session.started
    LiveInitialSessionAudioOutputParam:
      description: Settings for speech generated by the Live model. Choose the voice before starting the session.
      type: object
      properties:
        voice:
          description: The voice used for Live speech, as a built-in voice name or a custom voice object containing its ID. Defaults to `marin` and cannot change after startup.
          oneOf:
          - anyOf:
            - type: string
            - type: string
              enum:
              - alloy
              - ash
              - ballad
              - beacon
              - bossa
              - cedar
              - cinder
              - coral
              - delta
              - echo
              - gleam
              - marin
              - meridian
              - quartz
              - ripple
              - sage
              - shimmer
              - stone
              - tempo
              - verse
              - vesper
              - willow
          - $ref: '#/components/schemas/LiveCustomVoiceParam'
      required: []
    LiveDelegationReasoningInputParam:
      description: Reasoning options for Responses requests made on behalf of the Live session.
      type: object
      properties:
        effort:
          anyOf:
          - description: How much reasoning effort the delegated Responses model should use. Supported values depend on the backend model.
            $ref: '#/components/schemas/LiveReasoningEffort'
          - type: 'null'
        summary:
          anyOf:
          - description: The reasoning summary to request from the delegated Responses model, when supported.
            $ref: '#/components/schemas/LiveReasoningSummary'
          - type: 'null'
      required: []
    LiveReasoningSummary:
      type: string
      enum:
      - concise
      - detailed
      - auto
    target_uri:
      type: string
      description: 'URI that should appear in the SIP Refer-To header. Supports values like

        `tel:+14155550123` or `sip:agent@example.com`.'
      example: tel:+14155550123
    LiveMediaSessionCreateParams:
      type: object
      description: Startup configuration for a Live media session. Follow the [Live prompting guide](https://developers.openai.com/api/docs/guides/live-prompting) when writing frontend instructions and the backend prompt under delegation.responses.instructions.
      properties:
        model:
          $ref: '#/components/schemas/ModelIdsLive'
        instructions:
          $ref: '#/components/schemas/instructions'
        audio:
          $ref: '#/components/schemas/LiveMediaSessionAudioParam'
          description: Startup audio configuration. WebRTC and SIP negotiate their audio format on the media transport.
        delegation:
          $ref: '#/components/schemas/delegation'
        store:
          $ref: '#/components/schemas/store'
        input:
          $ref: '#/components/schemas/input'
        client:
          $ref: '#/components/schemas/LiveClientConfigParam'
      required:
      - model
      additionalProperties: false
    instructions:
      anyOf:
      - description: Frontend instructions for voice, conversation, interruptions, and when to delegate. Start with the [Live prompting guide](https://developers.openai.com/api/docs/guides/live-prompting); put business rules and tool workflows in a separate [backend prompt](https://developers.openai.com/api/docs/guides/live-delegation#start-with-your-existing-backend-prompt). Limited to 16,384 client-supplied tokens. Omitted or blank instructions use server defaults. Immutable after startup.
        type: string
      - type: 'null'
    LiveCallAcceptRequest:
      type: object
      description: Accept an incoming SIP call with Live startup configuration.
      properties:
        session:
          $ref: '#/components/schemas/LiveCallAcceptSession'
          description: Model and startup configuration for the Live session that answers the incoming SIP call.
      required:
      - session
      additionalProperties: false
    LiveWebRTCTransport:
      type: object
      description: WebRTC transport carrying the offer SDP in a creation request or answer SDP in its response.
      properties:
        type:
          type: string
          description: The transport used for the Live session. Always `webrtc`.
          enum:
          - webrtc
          x-stainless-const: true
        sdp:
          type: string
          minLength: 1
          description: Session Description Protocol message for the WebRTC connection.
      required:
      - type
      - sdp
      additionalProperties: false
    LiveFunctionToolChoiceParam:
      type: object
      properties:
        type:
          default: function
          x-stainless-const: true
          type: string
          enum:
          - function
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
      required:
      - type
      - name
    delegation:
      anyOf:
      - description: Who handles tasks delegated by the Live model. Omitted or null selects your application; use `responses` to let the API manage a Responses backend.
        discriminator:
          propertyName: type
        oneOf:
        - $ref: '#/components/schemas/LiveClientDelegationParam'
        - $ref: '#/components/schemas/LiveResponsesDelegationParam'
      - type: 'null'
    LiveClientDelegationParam:
      description: Delegate tasks to your application. The Live session emits delegation events that your backend handles.
      type: object
      properties:
        type:
          description: The delegation owner. Always `client` for tasks handled by your application.
          default: client
          x-stainless-const: true
          type: string
          enum:
          - client
      required:
      - type
    LiveTextVerbosity:
      type: string
      enum:
      - low
      - medium
