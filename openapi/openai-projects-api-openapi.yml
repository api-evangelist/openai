        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        first_id:
          anyOf:
          - type: string
          - type: 'null'
        last_id:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - object
      - data
      - has_more
    ProjectUserDeleteResponse:
      type: object
      properties:
        object:
          type: string
          enum:
          - organization.project.user.deleted
          x-stainless-const: true
        id:
          type: string
        deleted:
          type: boolean
      required:
      - object
      - id
      - deleted
    ProjectServiceAccountListResponse:
      type: object
      properties:
        object:
          type: string
