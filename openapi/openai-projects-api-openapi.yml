      - error
    ProjectApiKeyListResponse:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
          x-stainless-const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectApiKey'
        first_id:
          anyOf:
          - type: string
          - type: 'null'
        last_id:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - object
      - data
      - has_more
    ProjectServiceAccountCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the service account being created.
        create_service_account_only:
          anyOf:
          - type: boolean
            description: Create the service account without default roles or an API key.
          - type: 'null'
        expires_in_seconds:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 31536000
          - type: 'null'
          description: Number of seconds until the initial API key expires. If omitted or null, the key does not expire unless the effective organization or project policy requires an expiration. When a policy sets a maximum lifetime, this value must be provided and must not exceed that limit. A non-null value cannot be used when `create_service_account_only` is true.
      required:
      - name
    ProjectApiKey:
      type: object
      description: Represents an individual API key in a project.
      properties:
        object:
          type: string
          enum:
          - organization.project.api_key
          description: The object type, which is always `organization.project.api_key`
          x-stainless-const: true
        redacted_value:
          type: string
          description: The redacted value of the API key
        name:
          type: string
          description: The name of the API key
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the API key was created
        expires_at:
          anyOf:
          - type: integer
            format: unixtime
          - type: 'null'
          description: The Unix timestamp (in seconds) when the API key expires, or null if it does not expire.
        last_used_at:
          anyOf:
          - type: integer
            format: unixtime
          - type: 'null'
          description: The Unix timestamp (in seconds) of when the API key was last used.
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints
        owner_project_access:
          type: string
          enum:
          - active
          - inactive
          description: Whether the API key's owner currently has effective access to the project.
        owner:
          type: object
          properties:
            type:
              type: string
              enum:
              - user
              - service_account
              description: '`user` or `service_account`'
            user:
              $ref: '#/components/schemas/ProjectApiKeyOwnerUser'
            service_account:
              $ref: '#/components/schemas/ProjectApiKeyOwnerServiceAccount'
      required:
      - object
      - redacted_value
      - name
      - created_at
      - last_used_at
      - id
      - owner_project_access
      - owner
      x-oaiMeta:
        name: The project API key object
        example: "{\n    \"object\": \"organization.project.api_key\",\n    \"redacted_value\": \"sk-abc...def\",\n    \"name\": \"My API Key\",\n    \"created_at\": 1711471533,\n    \"expires_at\": 1714063533,\n    \"last_used_at\": 1711471534,\n    \"id\": \"key_abc\",\n    \"owner_project_access\": \"active\",\n    \"owner\": {\n        \"type\": \"user\",\n        \"user\": {\n            \"id\": \"user_abc\",\n            \"name\": \"First Last\",\n            \"email\": \"user@example.com\",\n            \"role\": \"owner\",\n            \"created_at\": 1711471533\n        }\n    }\n}\n"
    ProjectApiKeyDeleteResponse:
      type: object
      properties:
        object:
          type: string
          enum:
          - organization.project.api_key.deleted
          x-stainless-const: true
        id:
          type: string
        deleted:
          type: boolean
      required:
      - object
      - id
      - deleted
    PublicProjectResidency:
      type: string
      enum:
      - GLOBAL
      - US_STORAGE_PROCESSING
      - EU_STORAGE_PROCESSING
      - JP_STORAGE
      - KR_STORAGE
      - CA_STORAGE
      - SG_STORAGE
      - IN_STORAGE
      - AU_STORAGE
      - GB_STORAGE
      - AE_STORAGE
      - AE_STORAGE_PROCESSING
    ProjectApiKeyOwnerServiceAccount:
      type: object
      description: The service account that owns a project API key.
      properties:
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints
        name:
          type: string
          description: The name of the service account.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the service account was created.
        role:
          type: string
          description: The service account's project role.
      required:
      - id
      - name
      - created_at
      - role
    Project:
      type: object
      description: Represents an individual project.
      properties:
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints
        object:
          type: string
