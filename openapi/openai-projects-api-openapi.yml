components:
  schemas:
    UpdateProjectServiceAccountBody:
      type: object
      description: Parameters for updating a project service account.
      properties:
        name:
          type: string
          description: The updated service account name.
        role:
          type: string
          enum:
          - member
          - owner
          description: The updated service account role.
    ProjectCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: The friendly name of the project, this name appears in reports.
        geography:
          anyOf:
          - type: string
          - type: 'null'
          deprecated: true
          description: 'Create the project with the specified data residency region. Your organization must have access to Data residency functionality in order to use. See [data residency controls](https://developers.openai.com/api/docs/guides/your-data#data-residency-controls) to review the functionality and limitations of setting this field.

            Deprecated: use `residency` instead. Do not provide both `geography` and `residency`.'
        residency:
          anyOf:
          - $ref: '#/components/schemas/PublicProjectResidency'
          - type: 'null'
          description: Create the project with the specified residency configuration. Your organization must have access to the requested residency configuration in order to use it. See [data residency controls](https://developers.openai.com/api/docs/guides/your-data#data-residency-controls) to review the functionality and limitations of setting this field.
        external_key_id:
          anyOf:
          - type: string
          - type: 'null'
          description: External key ID to associate with the project.
      required:
      - name
    Error:
      type: object
      properties:
        code:
          anyOf:
          - type: string
          - type: 'null'
        message:
          type: string
        param:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        misalignment:
          $ref: '#/components/schemas/MisalignmentErrorDetailsResource'
      required:
      - type
      - message
      - param
      - code
    ProjectUserListResponse:
      type: object
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectUser'
        first_id:
          anyOf:
          - type: string
          - type: 'null'
        last_id:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
      required:
      - object
      - data
      - has_more
    ProjectRateLimitUpdateRequest:
      type: object
      properties:
        max_requests_per_1_minute:
          type: integer
          description: The maximum requests per minute.
        max_tokens_per_1_minute:
          type: integer
          description: The maximum tokens per minute.
        max_images_per_1_minute:
          type: integer
          description: The maximum images per minute. Only relevant for certain models.
        max_audio_megabytes_per_1_minute:
          type: integer
          description: The maximum audio megabytes per minute. Only relevant for certain models.
        max_requests_per_1_day:
          type: integer
          description: The maximum requests per day. Only relevant for certain models.
        batch_1_day_max_input_tokens:
          type: integer
          description: The maximum batch input tokens per day. Only relevant for certain models.
    ProjectModelPermissions:
      type: object
      description: Represents the model allowlist or denylist policy for a project.
      properties:
        object:
          type: string
          enum:
          - project.model_permissions
          description: The object type, which is always `project.model_permissions`.
          x-stainless-const: true
        mode:
          type: string
          enum:
          - allow_list
          - deny_list
          description: Whether the project uses an allowlist or a denylist.
        model_ids:
          type: array
          items:
            type: string
          description: The model IDs included in the model permissions policy.
      required:
      - object
      - mode
      - model_ids
      x-oaiMeta:
        name: The project model permissions object
        example: "{\n    \"object\": \"project.model_permissions\",\n    \"mode\": \"allow_list\",\n    \"model_ids\": [\n        \"gpt-6-astra\",\n        \"o3\"\n    ]\n}\n"
    ProjectModelPermissionsUpdateRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - allow_list
          - deny_list
          description: The model permissions mode to apply.
        model_ids:
          type: array
          items:
            type: string
          description: The model IDs included in this permissions policy.
      required:
      - mode
      - model_ids
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
      - message
    ProjectApiKeyOwnerUser:
      type: object
      description: The user that owns a project API key.
      properties:
        id:
          type: string
          description: The identifier, which can be referenced in API endpoints
        email:
          type: string
          description: The email address of the user.
        name:
          type: string
          description: The name of the user.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the user was created.
        role:
          type: string
          description: The user's project role.
      required:
      - id
      - email
      - name
      - created_at
      - role
    ProjectListResponse:
      type: object
      properties:
        object:
