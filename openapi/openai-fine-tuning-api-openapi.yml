components:
  schemas:
    EvalItemInputImage:
      title: Input image
      description: An image input block used within EvalItem content arrays.
      type: object
      properties:
        type:
          type: string
          description: 'The type of the image input. Always `input_image`.

            '
          enum:
          - input_image
          x-stainless-const: true
        image_url:
          type: string
          format: uri
          description: 'The URL of the image input.

            '
        detail:
          type: string
          description: 'The detail level of the image to be sent to the model. One of `high`, `low`, or `auto`. Defaults to `auto`.

            '
      required:
      - type
      - image_url
    GraderLabelModel:
      type: object
      title: LabelModelGrader
      description: 'A LabelModelGrader object which uses a model to assign labels to each item

        in the evaluation.

        '
      properties:
        type:
          description: The object type, which is always `label_model`.
          type: string
          enum:
          - label_model
          x-stainless-const: true
        name:
          type: string
          description: The name of the grader.
        model:
          type: string
          description: The model to use for the evaluation. Must support structured outputs.
        input:
          type: array
          items:
            $ref: '#/components/schemas/EvalItem'
        labels:
          type: array
          items:
            type: string
          description: The labels to assign to each item in the evaluation.
        passing_labels:
          type: array
          items:
            type: string
          description: The labels that indicate a passing result. Must be a subset of labels.
      required:
      - type
      - model
      - input
      - passing_labels
      - labels
      - name
      x-oaiMeta:
        name: Label Model Grader
        group: graders
        example: "{\n  \"name\": \"First label grader\",\n  \"type\": \"label_model\",\n  \"model\": \"gpt-4o-2024-08-06\",\n  \"input\": [\n    {\n      \"type\": \"message\",\n      \"role\": \"system\",\n      \"content\": {\n        \"type\": \"input_text\",\n        \"text\": \"Classify the sentiment of the following statement as one of positive, neutral, or negative\"\n      }\n    },\n    {\n      \"type\": \"message\",\n      \"role\": \"user\",\n      \"content\": {\n        \"type\": \"input_text\",\n        \"text\": \"Statement: {{item.response}}\"\n      }\n    }\n  ],\n  \"passing_labels\": [\n    \"positive\"\n  ],\n  \"labels\": [\n    \"positive\",\n    \"neutral\",\n    \"negative\"\n  ]\n}\n"
    GraderMulti:
      type: object
      title: MultiGrader
      description: A MultiGrader object combines the output of multiple graders to produce a single score.
      properties:
        type:
          type: string
          enum:
          - multi
          default: multi
          description: The object type, which is always `multi`.
          x-stainless-const: true
        name:
          type: string
          description: The name of the grader.
        graders:
          oneOf:
          - $ref: '#/components/schemas/GraderStringCheck'
          - $ref: '#/components/schemas/GraderTextSimilarity'
          - $ref: '#/components/schemas/GraderPython'
          - $ref: '#/components/schemas/GraderScoreModel'
          - $ref: '#/components/schemas/GraderLabelModel'
        calculate_output:
          type: string
          description: A formula to calculate the output based on grader results.
      required:
      - name
      - type
      - graders
      - calculate_output
      x-oaiMeta:
        name: Multi Grader
        group: graders
        example: "{\n  \"type\": \"multi\",\n  \"name\": \"example multi grader\",\n  \"graders\": [\n    {\n      \"type\": \"text_similarity\",\n      \"name\": \"example text similarity grader\",\n      \"input\": \"The graded text\",\n      \"reference\": \"The reference text\",\n      \"evaluation_metric\": \"fuzzy_match\"\n    },\n    {\n      \"type\": \"string_check\",\n      \"name\": \"Example string check grader\",\n      \"input\": \"{{sample.output_text}}\",\n      \"reference\": \"{{item.label}}\",\n      \"operation\": \"eq\"\n    }\n  ],\n  \"calculate_output\": \"0.5 * text_similarity_score +  0.5 * string_check_score)\"\n}\n"
    FineTuningIntegration:
      type: object
      title: Fine-Tuning Job Integration
      required:
      - type
      - wandb
      properties:
        type:
          type: string
          description: The type of the integration being enabled for the fine-tuning job
          enum:
          - wandb
          x-stainless-const: true
        wandb:
          type: object
          description: 'The settings for your integration with Weights and Biases. This payload specifies the project that

            metrics will be sent to. Optionally, you can set an explicit display name for your run, add tags

            to your run, and set a default entity (team, username, etc) to be associated with your run.

            '
          required:
          - project
          properties:
            project:
              description: 'The name of the project that the new run will be created under.

                '
              type: string
              example: my-wandb-project
            name:
              anyOf:
              - description: 'A display name to set for the run. If not set, we will use the Job ID as the name.

                  '
                type: string
              - type: 'null'
            entity:
              anyOf:
              - description: 'The entity to use for the run. This allows you to set the team or username of the WandB user that you would

                  like associated with the run. If not set, the default entity for the registered WandB API key is used.

                  '
                type: string
              - type: 'null'
            tags:
              description: 'A list of tags to be attached to the newly created run. These tags are passed through directly to WandB. Some

                default tags are generated by OpenAI: "openai/finetune", "openai/{base-model}", "openai/{ftjob-abcdef}".

                '
              type: array
              items:
                type: string
                example: custom-tag
    FineTuningJob:
      type: object
      title: FineTuningJob
      description: 'The `fine_tuning.job` object represents a fine-tuning job that has been created through the API.

        '
      properties:
        id:
          type: string
          description: The object identifier, which can be referenced in the API endpoints.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) for when the fine-tuning job was created.
        error:
          anyOf:
          - type: object
            description: For fine-tuning jobs that have `failed`, this will contain more information on the cause of the failure.
            properties:
              code:
                type: string
                description: A machine-readable error code.
              message:
                type: string
                description: A human-readable error message.
              param:
                anyOf:
                - type: string
                  description: The parameter that was invalid, usually `training_file` or `validation_file`. This field will be null if the failure was not parameter-specific.
                - type: 'null'
            required:
            - code
            - message
            - param
          - type: 'null'
        fine_tuned_model:
          anyOf:
          - type: string
            description: The name of the fine-tuned model that is being created. The value will be null if the fine-tuning job is still running.
          - type: 'null'
        finished_at:
          anyOf:
          - type: integer
            format: unixtime
            description: The Unix timestamp (in seconds) for when the fine-tuning job was finished. The value will be null if the fine-tuning job is still running.
          - type: 'null'
        hyperparameters:
          type: object
          description: The hyperparameters used for the fine-tuning job. This value will only be returned when running `supervised` jobs.
          properties:
            batch_size:
              anyOf:
              - description: 'Number of examples in each batch. A larger batch size means that model parameters

                  are updated less frequently, but with lower variance.

                  '
                oneOf:
                - type: string
                  enum:
                  - auto
                  x-stainless-const: true
                - type: integer
                  minimum: 1
                  maximum: 256
                default: auto
              - type: 'null'
            learning_rate_multiplier:
              description: 'Scaling factor for the learning rate. A smaller learning rate may be useful to avoid

                overfitting.

                '
              oneOf:
              - type: string
                enum:
                - auto
                x-stainless-const: true
              - type: number
                minimum: 0
                exclusiveMinimum: true
              default: auto
            n_epochs:
              description: 'The number of epochs to train the model for. An epoch refers to one full cycle

                through the training dataset.

                '
              oneOf:
              - type: string
                enum:
                - auto
                x-stainless-const: true
              - type: integer
                minimum: 1
                maximum: 50
              default: auto
        model:
          type: string
          description: The base model that is being fine-tuned.
        object:
          type: string
          description: The object type, which is always "fine_tuning.job".
          enum:
          - fine_tuning.job
          x-stainless-const: true
        organization_id:
          type: string
