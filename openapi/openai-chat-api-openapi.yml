            json_schema:
              type: object
              description: The JSON schema the model must conform to when type is json_schema. Enables Structured Outputs.
              properties:
                name:
                  type: string
                  description: The name of the response format.
                schema:
                  type: object
                  description: The JSON Schema object.
                strict:
                  type: boolean
                  default: false
                  description: Whether to enable strict schema adherence.
          example: example_value
        seed:
          type: integer
          description: If specified, the system will make a best effort to sample deterministically so that repeated requests with the same seed and parameters should return the same result.
