          example: 42.5
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 1
          description: An alternative to sampling with temperature, called nucleus sampling. The model considers the results of the tokens with top_p probability mass.
          example: 42.5
        tools:
          type: array
