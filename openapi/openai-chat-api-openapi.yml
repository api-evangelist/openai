components:
  schemas:
    CreateChatCompletionResponse:
      type: object
      description: Represents a chat completion response returned by model, based on the provided input.
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          description: A list of chat completion choices. Can be more than one if `n` is greater than 1.
          items:
            type: object
            required:
            - finish_reason
            - index
            - message
            - logprobs
            properties:
              finish_reason:
                type: string
                description: 'The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence,

                  `length` if the maximum number of tokens specified in the request was reached,

                  `content_filter` if content was omitted due to a flag from our content filters,

                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.

                  '
                enum:
                - stop
                - length
                - tool_calls
                - content_filter
                - function_call
              index:
                type: integer
                description: The index of the choice in the list of choices.
              message:
                $ref: '#/components/schemas/ChatCompletionResponseMessage'
              logprobs:
                description: Log probability information for the choice.
                type:
                - object
                - 'null'
                properties:
                  content:
                    description: A list of message content tokens with log probability information.
                    type:
                    - array
                    - 'null'
                    items:
                      $ref: '#/components/schemas/ChatCompletionTokenLogprob'
                required:
                - content
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the chat completion was created.
        model:
          type: string
          description: The model used for the chat completion.
        system_fingerprint:
          type: string
          description: 'This fingerprint represents the backend configuration that the model runs with.


            Can be used in conjunction with the `seed` request parameter to understand when backend changes have been made that might impact determinism.

            '
        object:
          type: string
          description: The object type, which is always `chat.completion`.
          enum:
          - chat.completion
        usage:
          $ref: '#/components/schemas/CompletionUsage'
      required:
      - choices
      - created
      - id
      - model
      - object
      x-oaiMeta:
        name: The chat completion object
        group: chat
        example: "{\n  \"id\": \"chatcmpl-123\",\n  \"object\": \"chat.completion\",\n  \"created\": 1677652288,\n  \"model\": \"gpt-3.5-turbo-0613\",\n  \"system_fingerprint\": \"fp_44709d6fcb\",\n  \"choices\": [{\n    \"index\": 0,\n    \"message\": {\n      \"role\": \"assistant\",\n      \"content\": \"\\n\\nHello there, how may I assist you today?\",\n    },\n    \"logprobs\": null,\n    \"finish_reason\": \"stop\"\n  }],\n  \"usage\": {\n    \"prompt_tokens\": 9,\n    \"completion_tokens\": 12,\n    \"total_tokens\": 21\n  }\n}\n"
    ChatCompletionTool:
      type: object
      required:
      - type
      - function
      properties:
        type:
          type: string
          enum:
          - function
          description: The type of the tool. Currently, only function is supported.
          example: function
        function:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: The name of the function to be called.
            description:
              type: string
              description: A description of what the function does, used by the model to choose when and how to call the function.
            parameters:
              type: object
              description: The parameters the function accepts, described as a JSON Schema object.
            strict:
              type: boolean
              default: false
              description: Whether to enable strict schema adherence for the function parameters. When enabled, the model will always follow the exact schema defined in the parameters field.
          example: example_value
    ContentPart:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
          - image_url
          description: The type of the content part.
          example: text
        text:
          type: string
          description: The text content. Required when type is text.
          example: example_value
        image_url:
          type: object
          description: The image URL content. Required when type is image_url.
          properties:
            url:
              type: string
              format: uri
              description: The URL of the image or a base64-encoded data URI.
            detail:
              type: string
              enum:
              - auto
              - low
              - high
              default: auto
              description: The detail level of the image. low uses fewer tokens, high allows the model to see the image in more detail.
          example: https://www.example.com
    ToolCall:
      type: object
      required:
      - id
      - type
      - function
      properties:
        id:
          type: string
          description: The ID of the tool call.
          example: abc123
        type:
          type: string
          enum:
          - function
          description: The type of the tool call.
          example: function
        function:
          type: object
          required:
          - name
          - arguments
          properties:
            name:
              type: string
              description: The name of the function to call.
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON format.
          example: example_value
    CreateChatCompletionResponse_2:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
          example: abc123
        object:
          type: string
          enum:
          - chat.completion
          description: The object type, always chat.completion.
          example: chat.completion
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the completion was created.
          example: 10
        model:
          type: string
          description: The model used for the chat completion.
          example: example_value
        choices:
          type: array
          description: A list of chat completion choices.
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
          example: []
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        system_fingerprint:
          type: string
          description: This fingerprint represents the backend configuration that the model runs with. Can be used with the seed parameter to detect backend changes.
          example: example_value
        service_tier:
          type: string
          description: The service tier used for processing the request.
          example: example_value
    ChatCompletionMessage:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
          description: The role of the message author.
          example: system
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ContentPart'
          description: The contents of the message. Can be a string or an array of content parts for multimodal inputs (text and images).
          example: example_value
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
          example: Example Title
        tool_calls:
          type: array
          description: The tool calls generated by the model, such as function calls.
          items:
            $ref: '#/components/schemas/ToolCall'
          example: []
        tool_call_id:
          type: string
          description: Tool call that this message is responding to. Required for tool role messages.
          example: '500123'
    CompletionUsage:
      type: object
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      properties:
        prompt_tokens:
          type: integer
          description: Number of tokens in the prompt.
          example: 10
        completion_tokens:
          type: integer
          description: Number of tokens in the generated completion.
          example: 10
        total_tokens:
          type: integer
          description: Total number of tokens used in the request (prompt + completion).
          example: 10
        completion_tokens_details:
          type: object
          description: Breakdown of completion tokens.
          properties:
            reasoning_tokens:
              type: integer
              description: Tokens generated by the model for reasoning.
            accepted_prediction_tokens:
              type: integer
              description: Predicted tokens that were accepted.
            rejected_prediction_tokens:
              type: integer
              description: Predicted tokens that were rejected.
          example: example_value
        prompt_tokens_details:
          type: object
          description: Breakdown of prompt tokens.
          properties:
            cached_tokens:
              type: integer
              description: Tokens that were cached from a previous request.
          example: example_value
    CreateChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: ID of the model to use. See the model endpoint compatibility table for which models work with the Chat API.
          examples:
          - gpt-5
          - gpt-4.1
          - gpt-4.1-mini
          - gpt-4.1-nano
          - o4-mini
        messages:
          type: array
          description: A list of messages comprising the conversation so far. Each message has a role (system, user, assistant, or tool) and content.
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
          example: []
        frequency_penalty:
          type: number
          minimum: -2.0
          maximum: 2.0
          default: 0
          description: Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
          example: 42.5
        logit_bias:
          type: object
          additionalProperties:
            type: integer
            minimum: -100
            maximum: 100
          description: Modify the likelihood of specified tokens appearing in the completion. Maps token IDs to bias values from -100 to 100.
          example: example_value
        logprobs:
          type: boolean
          default: false
          description: Whether to return log probabilities of the output tokens.
          example: true
        top_logprobs:
          type: integer
          minimum: 0
          maximum: 20
          description: An integer specifying the number of most likely tokens to return at each token position, each with an associated log probability. logprobs must be set to true if this parameter is used.
          example: 10
        max_tokens:
          type: integer
          minimum: 1
          description: The maximum number of tokens that can be generated in the chat completion. The total length of input tokens and generated tokens is limited by the model's context length.
          example: 10
        max_completion_tokens:
          type: integer
          minimum: 1
          description: An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and reasoning tokens.
          example: 10
