generated: '2026-08-27'
method: searched
source: >-
  Two sources, deliberately kept apart. PROVIDER-PUBLISHED: OpenAI's own Agent
  Skills repository, cloned verbatim to skills/skills/ from
  https://github.com/openai/skills — 5 system skills and 39 curated skills,
  distributed with the Codex CLI. API-GROUNDED: eight skills generated by API
  Evangelist from OpenAI's OpenAPI, mirroring the workflows in arazzo/, with
  every step bound to an operationId verified verbatim in openapi/.
description: >-
  OpenAI is one of very few providers in the catalog that PUBLISHES Agent
  Skills, and the distinction between what it publishes and what we generate is
  worth keeping visible. OpenAI's own skills are about driving CODEX — deploying
  to Vercel, working Figma, fixing CI, writing threat models. NOT ONE of them
  teaches an agent to call the OpenAI API. The eight skills below fill that gap:
  each one binds a marquee flow to real operationIds and carries the three rules
  an agent gets wrong at OpenAI specifically — that there is no idempotency key,
  that 429 means five different things and only one is retryable, and that every
  DELETE is permanent because no restore operation exists anywhere in the
  contract.
