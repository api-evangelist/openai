description: >-
  First-party OpenAI client libraries and developer tools, each confirmed
  against its public registry with the latest published version and its release
  date read from registry metadata rather than from documentation prose. Every
  core-language SDK is under active release: seven of the ten official server
  SDKs published a version within the last eight days, and the Node, Python, Go
  and Ruby clients all published within 30 hours of this read. The one abandonment
  signal in the set is `ruby-openai` (community, NOT first-party) which last shipped
  2025-08-29 and is superseded by OpenAI's own `openai` gem. Go is the one place a
  consumer can get badly stale code: the un-suffixed module path and /v2 both still
  resolve and are 13 and 11 months behind /v3 respectively.
