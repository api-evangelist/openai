  day. The one abandonment signal in the set is `ruby-openai` (community, NOT first-party) which last shipped 2025-08-29 and is superseded by
  OpenAI''s own `openai` gem. Go is the one place a consumer can get badly stale code: the un-suffixed module path and /v2 both still resolve
  and are 14 and 12 months behind /v3 respectively. The Apps SDK UI package (@openai/apps-sdk-ui) has not released since 2026-05-05 — nearly five
  months while the rest of the estate ships weekly.'
