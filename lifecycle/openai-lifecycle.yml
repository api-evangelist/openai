  here), https://developers.openai.com/changelog/,
  https://status.openai.com/ and its JSON API
  https://status.openai.com/api/v2/status.json (HTTP 200, application/json),
  https://openai.com/policies/service-terms/, plus `deprecated:` flags in
  openapi/_original/openai-openapi-master.yml.
description: >-
  OpenAI's lifecycle discipline is unusual and worth stating precisely: it
  publishes a genuinely strong, dated, model-level deprecation policy with 3-6
  month notice windows — better than most of the catalog — but it versions the
  API almost not at all. There is no dated API version, no version request
  header, and no API-level breaking-change train. What actually gets retired at
  OpenAI is MODELS and PRODUCTS, not endpoint shapes, so the deprecation page is
  the versioning story. The gap an agent feels is that none of this reaches the
  wire: no RFC 8594 Sunset or Deprecation response header is emitted, so a
  client calling a model that shuts down in 30 days learns nothing from the
  response and must poll a web page.
versioning:
  scheme: none-at-the-api-level
  mechanism: >-
    A single unversioned surface under the /v1 path prefix. Model identity is the
    real version axis — callers pin a dated model snapshot (e.g.
    gpt-image-2-2026-04-21) rather than an API version.
  version_header: null
  spec_version: 2.3.0
  spec_version_source: openapi/_original/openai-openapi-master.yml info.version
  docs: https://developers.openai.com/api/docs/deprecations
  notes: >-
    A `beta` marker exists in x-oaiMeta navigation groups (ChatKit is flagged
    beta) and some surfaces require an OpenAI-Beta request header — the Realtime
    API requires `OpenAI-Beta: realtime=v1`. That is the closest thing to
    versioning the wire carries.
deprecation:
  policy_url: https://developers.openai.com/api/docs/deprecations
  changelog: https://developers.openai.com/changelog/
  sunset_header: false
  deprecation_header: false
  notice_windows:
    - class: generally-available models
      minimum_notice: 6 months
    - class: specialized variants (chat variants, Codex variants)
      minimum_notice: 3 months
    - class: preview models
      minimum_notice: as little as 2 weeks
  expedited: Safety or compliance concerns may shorten any of these windows.
  notes: >-
    Notice is published on a page with an announced date and a shutdown date per
    entry. Nothing is signalled in HTTP responses, so an integration cannot
    detect its own deprecation programmatically.
