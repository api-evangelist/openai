description: >-
  OpenAI publishes real Protobuf service definitions, and every one of them is a
  TOOLING protocol rather than an API contract. Nothing here describes
  api.openai.com: there is no gRPC surface for chat, responses, embeddings or
  administration, and none is documented. What exists is three protocols inside
  the Codex CLI (code-mode host, exec-server relay, thread config) and two inside
  OpenAI's Apple-Silicon VM orchestration stack (Orchard, tart-guest-agent).
  Recorded because they are genuine first-party published contracts under an
  OpenAI-owned org, and flagged plainly so nobody mistakes them for a gRPC
  version of the OpenAI API.
