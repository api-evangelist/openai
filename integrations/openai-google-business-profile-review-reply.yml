arazzo: 1.0.1
info:
  title: OpenAI Google Business Profile review reply
  summary: Reply to Google Business Profile reviews with text generated by OpenAI
  description: Reads the latest review for a Google Business Profile location, drafts a reply with an OpenAI chat completion, and posts it as the review reply. Recreated from the Zapier template linked
    in x-integration.
  version: 1.0.0
sourceDescriptions:
- name: gbpAccounts
  url: https://raw.githubusercontent.com/api-evangelist/google-business-profile/refs/heads/main/openapi/google-business-profile-accounts-api-openapi.yml
  type: openapi
- name: openaiChat
  url: https://raw.githubusercontent.com/api-evangelist/openai/refs/heads/main/openapi/openai-chat-completions-api-openapi.yml
  type: openapi
workflows:
- workflowId: google-business-profile-review-reply
  summary: Reply to Google Business Profile reviews with text generated by OpenAI
  description: Reads the latest review for a Google Business Profile location, drafts a reply with an OpenAI chat completion, and posts it as the review reply. Recreated from the Zapier template linked
    in x-integration.
  inputs:
    type: object
    properties:
      accountId:
        type: string
      locationId:
        type: string
      model:
        type: string
        description: OpenAI model id
  steps:
  - stepId: list-reviews
    description: Read the location reviews.
    operationId: $sourceDescriptions.gbpAccounts.listReviews
    parameters:
    - name: accountId
      in: path
      value: $inputs.accountId
    - name: locationId
      in: path
      value: $inputs.locationId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      reviewId: $response.body#/reviews/0/reviewId
      comment: $response.body#/reviews/0/comment
      starRating: $response.body#/reviews/0/starRating
  - stepId: generate-text
    description: Generate the text with an OpenAI chat completion.
    operationId: $sourceDescriptions.openaiChat.createChatCompletion
    requestBody:
      contentType: application/json
      payload:
        model: $inputs.model
        messages:
        - role: developer
          content: Write a short, courteous reply to this customer review on behalf of the business.
        - role: user
          content: $steps.list-reviews.outputs.comment
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      text: $response.body#/choices/0/message/content
  - stepId: reply-to-review
    description: Post the generated reply.
    operationId: $sourceDescriptions.gbpAccounts.replyToReview
    parameters:
    - name: accountId
      in: path
      value: $inputs.accountId
    - name: locationId
      in: path
      value: $inputs.locationId
    - name: reviewId
      in: path
      value: $steps.list-reviews.outputs.reviewId
    requestBody:
      contentType: application/json
      payload:
        comment: $steps.generate-text.outputs.text
    successCriteria:
    - condition: $statusCode == 200
  outputs:
    reviewId: $steps.list-reviews.outputs.reviewId
    reply: $steps.generate-text.outputs.text
x-integration:
  partner: google-business-profile
  template: https://zapier.com/apps/google-business-profile/integrations/google-business-profile/1800781/automatically-reply-to-google-business-profile-reviews-with-chatgpt
  edge_evidence: https://zapier.com/apps/google-business-profile/integrations/google-business-profile/1800781/automatically-reply-to-google-business-profile-reviews-with-chatgpt
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: generate-text
    cause: provider-contract
    why: createChatCompletion 200 may be JSON or an event stream; /choices/0/message/content is taken from the schema, not a settled single-content response
