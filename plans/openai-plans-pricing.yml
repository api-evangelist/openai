delivery:
  delivery: managed
  note: >-
    OpenAI operates the API as a managed service on api.openai.com. There is no
    self-hosted edition of the platform; the open-weight `gpt-oss` family is
    distributed separately and is not this pricing surface.
plan_count: 13
reconciled: true
supersedes: >-
  The 2026-05-04 bulk-sweep version of this file, which was written without fetching the pricing
  page and topped out at GPT-5.5 — three model generations behind by the time it was read. Every
  price below was read from https://developers.openai.com/api/docs/pricing on 2026-08-27 and cross-checked
  against the dated pricing entries in the changelog (changelog/openai-changelog.yml, 2026-07-30
  and 2026-08-21).
tags:
- AI
- LLM
- GPT
- Foundation Models
- Usage-Based Pricing
description: >-
  OpenAI sells API access purely on metered token consumption — there are no seat plans, no monthly
  subscription tiers and no free-forever allowance on the API itself. The plan axis is the MODEL
  and the discount axis is the SERVICE TIER, and the two multiply: the same model costs half as much
  through the Batch API and twice as much in Fast mode. Prices moved down three times in the four
  weeks before this read (GPT-5.6 Luna -80%, Terra -20% on 2026-07-30; Sol to $4/$20 on 2026-08-21),
  so any cached copy of this page ages badly. Note the one uplift: regional processing adds 10% for
  models released on or after 2026-03-05. Access tiers (Free through Tier 5) are a RATE-LIMIT construct,
  not a price construct, and live in rate-limits/openai-rate-limits.yml.
currency: USD
unit: per 1,000,000 tokens
service_tiers:
- name: Standard
  multiplier: 1.0
  note: Base pricing, synchronous.
- name: Batch
  multiplier: 0.5
  note: 50% discount on input and output. Asynchronous; cancellable in flight.
- name: Flex
  multiplier: 0.5
  note: Documented as similar to Batch pricing.
- name: Fast mode
  multiplier: 2.0
  note: 2x standard. Replaced Priority Processing on 2026-07-30; supports >272K token context.
- name: Ultrafast
  multiplier: null
  note: Announced 2026-08-13 for GPT-5.6 Sol, up to 14x faster, limited preview to select customers.
    No public price.
uplifts:
- name: Regional processing
  pct: 10
  note: >-
    10% uplift for models released on or after 2026-03-05. Selectable per request via prefixed domains
    for keys in projects with Global geography (changelog 2026-08-21).
enterprise:
  contact: https://openai.com/contact-sales/
  note: Custom rate limits above Tier 5 and enterprise agreements are arranged through sales; no
    public price.
