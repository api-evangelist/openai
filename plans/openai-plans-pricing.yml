name: OpenAI API Plans
specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: OpenAI
providerId: openai
created: '2026-05-04'
modified: '2026-11-05'
generated: '2026-11-05'
method: searched
source: https://developers.openai.com/api/docs/pricing.md
sources:
- https://developers.openai.com/api/docs/pricing
- https://developers.openai.com/api/docs/pricing.md
- https://openai.com/api/pricing/
- https://developers.openai.com/changelog/
- https://developers.openai.com/api/docs/guides/rate-limits
audience: developer-api
pricing_basis: usage-other
published: true
delivery:
  delivery: managed
  note: OpenAI operates the API as a managed service on api.openai.com. There is no self-hosted edition of the platform;
    the open-weight `gpt-oss` family is distributed separately and is not this pricing surface.
plan_count: 27
reconciled: true
supersedes: 'The 2026-09-23 version of this file, which listed 13 models topping out at GPT-5.6. Every price below
  was read from https://developers.openai.com/api/docs/pricing.md on 2026-11-05: the two Standard flagship tables,
  short-context input, output and cached input per 1M tokens. Removed because they are no longer on the pricing
  page: o3 Mini, o1, GPT-3.5 Turbo.'
tags:
- AI
- LLM
- GPT
- Foundation Models
- Usage-Based Pricing
description: 'OpenAI sells API access purely on metered token consumption — there are no seat plans, no monthly
  subscription tiers and no free-forever allowance on the API itself. The plan axis is the MODEL and the discount
  axis is the SERVICE TIER, and the two multiply: the same model costs half as much through the Batch API and twice
  as much in Fast mode. Prices moved down three times in the four weeks before this read (GPT-5.6 Luna -80%, Terra
  -20% on 2026-07-30; Sol to $4/$20 on 2026-08-21), so any cached copy of this page ages badly. Note the one uplift:
  regional processing adds 10% for models released on or after 2026-03-05. Access tiers (Free through Tier 5) are
  a RATE-LIMIT construct, not a price construct, and live in rate-limits/openai-rate-limits.yml.'
currency: USD
unit: per 1,000,000 tokens
service_tiers:
- name: Standard
  multiplier: 1.0
  note: Base pricing, synchronous.
- name: Batch
  multiplier: 0.5
  note: 50% discount on input and output. Asynchronous; cancellable in flight.
- name: Flex
  multiplier: 0.5
  note: Documented as similar to Batch pricing.
- name: Fast mode
  multiplier: 2.0
  note: 2x standard. Replaced Priority Processing on 2026-07-30; supports >272K token context.
- name: Ultrafast
  multiplier: null
  note: Announced 2026-08-13 for GPT-5.6 Sol, up to 14x faster, limited preview to select customers. No public price.
uplifts:
- name: Regional processing
  pct: 10
  note: 10% uplift for models released on or after 2026-03-05. Selectable per request via prefixed domains for keys
    in projects with Global geography (changelog 2026-08-21).
enterprise:
  contact: https://openai.com/contact-sales/
  note: Custom rate limits above Tier 5 and enterprise agreements are arranged through sales; no public price.
