      illegal or violating content. The Bug Bounty is a security channel, not a
      content channel.
support_lifetime:
  stated_period: >-
    Generally-available models: 6 months minimum notice. Specialized variants
    (chat variants, Codex variants): 3 months minimum. Preview models: as
    little as 2 weeks.
