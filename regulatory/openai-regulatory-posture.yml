generated: '2026-09-23'
method: searched
source: >-
  Harvested from OpenAI's own published pages on 2026-09-23:
  https://openai.com/policies/sub-processor-list/ (last updated 2026-07-09),
  https://openai.com/policies/privacy-policy/ (updated 2026-09-10),
  https://openai.com/policies/data-processing-addendum/,
  https://openai.com/enterprise-privacy/,
  https://openai.com/security-and-privacy/,
  https://developers.openai.com/api/docs/guides/your-data.md, and
  https://developers.openai.com/api/docs/guides/safety-checks/under-18-api-guidance.md.
  Trust portal (https://trust.openai.com/) refuses automated clients (403) but the
  same certifications are enumerated on openai.com/security-and-privacy/ and
  recorded in security/openai-trust-center.yml.
description: >-
  OpenAI publishes a rich horizontal regulatory surface for the API — a dated
  sub-processor list with per-country processing locations, a GDPR-scoped DPA
  citing SCCs, a US privacy policy that names Global Privacy Control as an
  honored opt-out signal, ISO/IEC 42001:2023 as an AI Management System
  certification, and API-side data-residency selection via prefixed regional
  domains. What is NOT published is equally worth recording as an honest absence:
  no VPAT or accessibility conformance report, no periodic transparency report
  enumerating government requests, no SBOM for the platform, no exit-assistance
  or data-portability commitment. HIPAA is contractual (BAAs are signed) but
  scoped to a specific set of endpoints via the Business Associate and
  Healthcare Addendum rather than published as an operational commitment.
