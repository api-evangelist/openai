generated: '2026-09-23'
method: searched
source: >-
  Harvested from OpenAI's own published pages on 2026-09-23:
  https://openai.com/policies/sub-processor-list/ (last updated 2026-07-09),
  https://openai.com/policies/privacy-policy/ (updated 2026-09-10),
  https://openai.com/policies/data-processing-addendum/,
  https://openai.com/enterprise-privacy/,
  https://openai.com/security-and-privacy/,
  https://developers.openai.com/api/docs/guides/your-data.md, and
  https://developers.openai.com/api/docs/guides/safety-checks/under-18-api-guidance.md.
  Trust portal (https://trust.openai.com/) refuses automated clients (403) but the
  same certifications are enumerated on openai.com/security-and-privacy/ and
  recorded in security/openai-trust-center.yml.
description: >-
  OpenAI publishes a rich horizontal regulatory surface for the API — a dated
  sub-processor list with per-country processing locations, a GDPR-scoped DPA
  citing SCCs, a US privacy policy that names Global Privacy Control as an
  honored opt-out signal, ISO/IEC 42001:2023 as an AI Management System
  certification, and API-side data-residency selection via prefixed regional
  domains. What is NOT published is equally worth recording as an honest absence:
  no VPAT or accessibility conformance report, no periodic transparency report
  enumerating government requests, no SBOM for the platform, no exit-assistance
  or data-portability commitment. HIPAA is contractual (BAAs are signed) but
  scoped to a specific set of endpoints via the Business Associate and
  Healthcare Addendum rather than published as an operational commitment.
signals:
  subprocessors:
    published: true
    url: https://openai.com/policies/sub-processor-list/
    last_updated: '2026-07-09'
    evidence: >-
      "Last updated: July 9, 2026 OpenAI Sub-processor list OpenAI engages the
      following entities to provide processing activities for Customer Data (as
      defined in the OpenAI Data Processing Agreement)."
    format: dated table with entity, product, processing location, purpose
    count_third_party: 17
    named_entities:
      - Cloudflare, Ltd.
      - Microsoft Corporation
      - CoreWeave, Inc.
      - Oracle Cloud Infrastructure
      - Google Cloud Platform
      - Amazon Web Services, Inc.
      - Cerebras
      - Snowflake, Inc.
      - TaskUs, LLC
      - Intercom, Inc.
      - Salesforce
      - Pylon Labs
      - Accenture International Limited
      - Fivetran, Inc.
      - Confluent
      - Cinder Technologies, Inc.
      - WorkOS, Inc.
      - Okta, Inc.
      - Merge API, Inc.
    note: >-
      Reachable directly at https://openai.com/policies/sub-processor-list/.
      https://platform.openai.com/subprocessors 302s to a Cloudflare challenge
      when reached anonymously; the canonical URL above is the readable form.
  data_processing_addendum:
    published: true
    url: https://openai.com/policies/data-processing-addendum/
    evidence: >-
      "SCCs means the standard contractual clauses for the transfer of personal
      data to third countries adopted by the EU Commission on June 4, 2021" and
      "an adequacy decision issued by the European Commission under Article 45
      GDPR."
    scope: GDPR (EU/EEA), UK GDPR, Swiss FADP
    transfer_mechanism: EU SCCs (2021/914) and UK Addendum
    contracting_entity: OpenAI Ireland Ltd. for EEA/Swiss customers; OpenAI OpCo, LLC elsewhere
  data_subject_request:
    published: true
    urls:
      - https://openai.com/policies/privacy-policy/
      - https://privacy.openai.com/
    channels:
      - mailto:dsar@openai.com
      - mailto:dpo@openai.com
      - mailto:privacy@openai.com
    evidence: >-
      Privacy policy names "The right to know", "The right to access your
      Personal Data, often in a portable format", "The right to request deletion
      of your Personal Data", "The right to correct your Personal Data", "The
      right to be free from discrimination" and directs requests to
      "dsar@openai.com" and the DPO "dpo@openai.com", plus the self-serve
      "privacy.openai.com" portal.
    portability: >-
      Policy states data is provided "often in a portable format"; no specific
      format (JSON/CSV) is named.
    deletion_window_days: 30
    deletion_evidence: >-
      "Once you choose to delete Personal Data, we will remove it from our
      systems within 30 days unless we need to retain it for longer as described
      below."
  global_privacy_control:
    published: true
    honored: true
    url: https://openai.com/policies/privacy-policy/
    evidence: >-
      "You can also opt out using a legally recognized opt-out mechanism, like
      Global Privacy Control."
    note: >-
      Recorded from a published commitment. NOT verified by sending a Sec-GPC
      header at the wire, per the pipeline rule: a live probe tests one request
      and a policy statement documents a commitment; they are different facts
      and only the policy is durable.
  data_residency:
    published: true
    urls:
      - https://developers.openai.com/api/docs/guides/your-data
      - https://developers.openai.com/api/docs/pricing
      - https://openai.com/policies/sub-processor-list/
    evidence: >-
      "Regional processing (data residency) endpoints are charged a 10% uplift
      for models released on or after March 5, 2026, that are eligible for data
      residency." Per-country processing locations for each cloud sub-processor
      (Microsoft, Google Cloud, Oracle, CoreWeave) are enumerated on the
      sub-processor list.
    api_selectable: true
    api_mechanism: >-
      Per-request regional processing via prefixed domains for API keys in
      projects with Global geography (added 2026-08-21, see
      changelog/openai-changelog.yml). See changelog entry
      "Regional processing selection" and pricing page uplift note.
    regions_enumerated_via_sub_processors:
      - Australia
      - Brazil
      - Canada
      - Finland
      - France
      - Germany
      - India
      - Indonesia
      - Ireland
      - Italy
      - Japan
      - Malaysia
      - Mexico
      - Netherlands
      - Norway
      - Poland
      - Singapore
      - South Africa
      - South Korea
      - Spain
      - Sweden
      - Switzerland
      - United Arab Emirates
      - United Kingdom
      - United States
    caveat: >-
      "For GPT-6 Sol and Luna, EU data residency is available only with Standard
      processing" — Fast mode and other tiers do not carry the same guarantee.
      A stated_period commitment on residency (how long the location holds) is
      not published; only the per-request selection is.
  ai_management_system:
    published: true
    standard: ISO/IEC 42001:2023
    url: https://openai.com/security-and-privacy/
    evidence: >-
      "OpenAI maintains an ISO/IEC 42001:2023 AI Management System covering
      OpenAI's consumer and business AI products and models in its role as an
      AI producer and AI provider."
    note: >-
      The one AI-specific management-system certification OpenAI publishes.
      Certification-family standards (SOC 2, ISO 27001, ISO 27017, ISO 27018,
      PCI DSS, FedRAMP, CSA STAR, GDPR) are catalogued in
      conformance/openai-conformance.yml and security/openai-trust-center.yml
      rather than duplicated here.
  age_assurance:
    published: partial
    url: https://developers.openai.com/api/docs/guides/safety-checks/under-18-api-guidance
    evidence: >-
      "Organizations serving minors must comply with all applicable child
      protection, safety, and privacy laws, including the Children's Online
      Privacy Protection Act (COPPA). You should not use OpenAI services to
      process any personal data of children under 13 or the applicable age of
      digital consent without first implementing zero data retention in our
      API." And: "Where required or otherwise appropriate for your use case,
      using age assurance systems to ensure only intended users can access the
      product."
    scope: caller obligation
    caveat: >-
      The published guidance directs API CALLERS to implement age assurance for
      their own users; OpenAI itself does not publish an age-assurance mechanism
      at the API layer. Recorded as `partial` for that reason — the topic is
      addressed, the mechanism is delegated.
  privacy_policy:
    published: true
    url: https://openai.com/policies/privacy-policy/
    last_updated: '2026-09-10'
    coverage:
      - US privacy policy with additional state disclosures (CCPA, VCDPA, CPA and successors)
      - Named Children section citing under-13 handling
      - Named Your Rights section citing access, deletion, correction, portability
    eu_url: https://openai.com/policies/eu-privacy-policy/
  incident_notification:
    published: partial
    url: https://openai.com/security-and-privacy/
    evidence: >-
      "Our security team has an on-call rotation that has 24/7/365 coverage and
      is paged in case of any potential security incident."
    caveat: >-
      A published customer-notification SLA (hours-to-notify on personal-data
      breach) is not stated on the public security page; the DPA carries the
      contractual commitment. Recorded as `partial` — a published operational
      capability, no stated notification window.
